# Despliegue en Render (https://render.com): Blueprint → New → conectar este repositorio.
# FARMIX es un producto mínimo viable en estudio: la demostración usa datos SIMULADOS.
# Limitaciones del plan gratuito: el servicio se "duerme" tras inactividad, la base gratuita caduca a los
# 30 días y los soportes subidos (STORAGE_DIR) se pierden en cada despliegue. Para algo duradero, use planes
# de pago y un disco persistente montado en STORAGE_DIR.
databases:
  - name: farmix-db
    plan: free
    databaseName: farmix
    user: farmix

services:
  - type: web
    name: farmix
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: farmix-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: EXPOSE_DOCS
        value: "false"
      - key: STORAGE_DIR
        value: /tmp/farmix-storage
      - key: MAIL_MODE
        value: dev
      - key: LOG_LEVEL
        value: info
      # Cuenta de demostración con datos simulados (correo demo@ejemplo.test). Render genera la clave:
      # véala en el panel del servicio → Environment → DEMO_PASSWORD. Ponga SEED_DEMO en "false" para desactivarla.
      - key: SEED_DEMO
        value: "true"
      - key: DEMO_PASSWORD
        generateValue: true
