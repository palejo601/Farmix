/* ================= Números animados ================= */
function cnt(v,fmt){ const f=fmt==='money'?money(v):fmt==='kg'?kgf(v):Math.round(v).toLocaleString('es-CO');
  return `<span data-count="${+v||0}" data-fmt="${fmt||'int'}">${f}</span>`; }
const sinMovimiento=()=>window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function animarNumeros(root){
  if(sinMovimiento()) return;
  root.querySelectorAll('[data-count]').forEach(el=>{ const fin=+el.dataset.count, fmt=el.dataset.fmt; if(!fin) return;
    const t0=performance.now(), dur=750, f=v=>fmt==='money'?money(v):fmt==='kg'?kgf(v):Math.round(v).toLocaleString('es-CO');
    const paso=t=>{ const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3); el.textContent=f(fin*e); if(k<1) requestAnimationFrame(paso); };
    requestAnimationFrame(paso); });
}

/* ================= Celebración ================= */
function celebrar(){
  if(sinMovimiento()) return;
  const cols=['#0B7A66','#4F46E5','#0284C7','#EA580C','#C026D3','#F5B700'], c=document.createElement('div'); c.className='confeti';
  for(let i=0;i<34;i++){ const s=document.createElement('i'); s.style.background=cols[i%cols.length];
    s.style.setProperty('--x',(Math.random()*2-1)*46+'vw'); s.style.setProperty('--y',(40+Math.random()*50)+'vh');
    s.style.setProperty('--r',(Math.random()*720-360)+'deg'); s.style.animationDelay=(Math.random()*.15)+'s'; c.appendChild(s); }
  document.body.appendChild(c); setTimeout(()=>c.remove(),1700);
}

const MOBILE=window.matchMedia&&window.matchMedia('(max-width: 820px), (pointer: coarse)').matches;
const THREE_URL='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
const FALLBACK3D=`<svg class="fb3d" viewBox="0 0 200 200" aria-hidden="true"><defs><linearGradient id="fb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5FE3C0"/><stop offset="1" stop-color="#5A4FE0"/></linearGradient></defs><circle cx="100" cy="100" r="82" fill="none" stroke="url(#fb)" stroke-width="2" stroke-dasharray="4 6"/><g transform="rotate(-35 100 100)"><rect x="52" y="80" width="96" height="40" rx="20" fill="#fff" stroke="url(#fb)" stroke-width="2"/><path d="M100 80h28a20 20 0 0 1 0 40h-28z" fill="url(#fb)"/></g></svg>`;

const Scene3D={
  ready:null, built:false, host:null, io:null, running:false, visible:true, focus:-1,
  load(){ if(this.ready) return this.ready;
    this.ready=new Promise(res=>{ if(window.THREE) return res(true); const s=document.createElement('script'); s.src=THREE_URL; s.async=true;
      s.onload=()=>res(!!window.THREE); s.onerror=()=>res(false); document.head.appendChild(s); setTimeout(()=>res(!!window.THREE),8000); });
    return this.ready; },
  build(){ if(this.built) return !!this.renderer; this.built=true;
    try{ this.renderer=new THREE.WebGLRenderer({antialias:!MOBILE,alpha:true,powerPreference:'high-performance'}); }catch(e){ this.renderer=null; return false; }
    const r=this.renderer; r.setPixelRatio(Math.min(window.devicePixelRatio||1,MOBILE?1.25:1.75));
    const scene=this.scene=new THREE.Scene(), cam=this.cam=new THREE.PerspectiveCamera(35,1,.1,100); cam.position.set(0,0,9);
    scene.add(new THREE.AmbientLight(0xffffff,.55));
    const key=new THREE.DirectionalLight(0xffffff,1.1); key.position.set(4,6,6); scene.add(key);
    const l1=new THREE.PointLight(0x5fe3c0,1.4,20); l1.position.set(-5,-2,3); scene.add(l1);
    const l2=new THREE.PointLight(0x7c74ff,1.2,20); l2.position.set(5,-3,-2); scene.add(l2);
    const group=this.group=new THREE.Group(); scene.add(group);
    const cap=this.cap=new THREE.Group(), R=.62, L=1.5, seg=MOBILE?32:56;
    const white=new THREE.MeshPhysicalMaterial({color:0xf4fbfa,roughness:.25,clearcoat:1,clearcoatRoughness:.15});
    const tint=new THREE.MeshPhysicalMaterial({color:0x2fb8b0,roughness:.18,metalness:.05,clearcoat:1,clearcoatRoughness:.1,transparent:true,opacity:.92});
    const half=(mat,dir)=>{ const g=new THREE.Group();
      const cyl=new THREE.Mesh(new THREE.CylinderGeometry(R,R,L/2,seg,1,true),mat); cyl.position.y=dir*L/4; g.add(cyl);
      const sph=new THREE.Mesh(new THREE.SphereGeometry(R,seg,seg/2,0,Math.PI*2,dir>0?0:Math.PI/2,Math.PI/2),mat); sph.position.y=dir*L/2; g.add(sph); return g; };
    cap.add(half(white,1)); cap.add(half(tint,-1));
    const band=new THREE.Mesh(new THREE.TorusGeometry(R*1.005,.025,12,seg),new THREE.MeshStandardMaterial({color:0x0b7a66,roughness:.4})); band.rotation.x=Math.PI/2; cap.add(band);
    cap.rotation.z=-.62; group.add(cap);
    const ring=this.ring=new THREE.Group(), RR=2.55;
    ring.add(new THREE.Mesh(new THREE.TorusGeometry(RR,.012,8,160),new THREE.MeshBasicMaterial({color:0x5fe3c0,transparent:true,opacity:.55})));
    this.nodes=[0x0b7a66,0x0284c7,0x4f46e5,0xea580c,0xc026d3].map((c,i)=>{ const a=i/5*Math.PI*2;
      const m=new THREE.Mesh(new THREE.SphereGeometry(.11,20,20),new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:.35,roughness:.3}));
      m.position.set(Math.cos(a)*RR,Math.sin(a)*RR,0); ring.add(m); return m; });
    ring.rotation.x=1.15; group.add(ring);
    const mol=this.mol=new THREE.Group(), atoms=[], n=MOBILE?7:12;
    for(let i=0;i<n;i++){ const p=new THREE.Vector3((Math.random()-.5)*5.2,(Math.random()-.5)*4.2,(Math.random()-.5)*2.6-.5); if(p.length()<1.6) p.setLength(1.8+Math.random());
      const a=new THREE.Mesh(new THREE.SphereGeometry(.05+Math.random()*.05,12,12),new THREE.MeshStandardMaterial({color:0xbfeee6,roughness:.4})); a.position.copy(p); mol.add(a); atoms.push(p); }
    const lp=[]; atoms.forEach((a,i)=>{ let b=-1,bd=9; atoms.forEach((c,j)=>{ if(j!==i){ const d=a.distanceTo(c); if(d<bd){bd=d;b=j;} } }); if(b>i||bd>1.6) return; lp.push(a.x,a.y,a.z,atoms[b].x,atoms[b].y,atoms[b].z); });
    const lg=new THREE.BufferGeometry(); lg.setAttribute('position',new THREE.Float32BufferAttribute(lp,3));
    mol.add(new THREE.LineSegments(lg,new THREE.LineBasicMaterial({color:0x5fe3c0,transparent:true,opacity:.35}))); group.add(mol);
    const pn=MOBILE?80:220, pos=new Float32Array(pn*3); for(let i=0;i<pn;i++){ pos[i*3]=(Math.random()-.5)*12; pos[i*3+1]=(Math.random()-.5)*10; pos[i*3+2]=(Math.random()-.5)*6-2; }
    const pg=new THREE.BufferGeometry(); pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
    this.pts=new THREE.Points(pg,new THREE.PointsMaterial({color:0x8fded0,size:.03,transparent:true,opacity:.6})); scene.add(this.pts);
    this.mx=0; this.my=0; this.tx=0; this.ty=0; this.t0=performance.now(); this.scaleV=new THREE.Vector3();
    if(!MOBILE) window.addEventListener('pointermove',e=>{ this.tx=e.clientX/innerWidth-.5; this.ty=e.clientY/innerHeight-.5; },{passive:true});
    window.addEventListener('resize',()=>this.resize());
    document.addEventListener('visibilitychange',()=>{ if(!document.hidden) this.start(); });
    return true; },
  async mount(host,{focus=-1,zoom=9}={}){
    host.innerHTML=FALLBACK3D; host.classList.add('s3d');
    const ok=await this.load(); if(!host.isConnected) return;
    if(!ok||!this.build()){ host.classList.add('no3d'); return; }
    host.querySelector('.fb3d')?.remove(); host.appendChild(this.renderer.domElement);
    this.host=host; this.focus=focus; this.cam.position.z=zoom; this.resize();
    if(this.io) this.io.disconnect();
    this.io=new IntersectionObserver(es=>{ this.visible=es[0].isIntersecting; if(this.visible) this.start(); }); this.io.observe(host);
    this.start(); },
  resize(){ if(!this.host||!this.renderer) return; const w=this.host.clientWidth||300, h=this.host.clientHeight||300; this.renderer.setSize(w,h,false); this.cam.aspect=w/h; this.cam.updateProjectionMatrix(); },
  frame(now){ const t=(now-this.t0)/1000, RMv=sinMovimiento();
    this.mx+=(this.tx-this.mx)*.05; this.my+=(this.ty-this.my)*.05;
    this.group.rotation.y=this.mx*.6+(RMv?0:Math.sin(t*.25)*.15); this.group.rotation.x=this.my*.35; this.group.position.y=RMv?0:Math.sin(t*.9)*.08;
    if(!RMv){ this.cap.rotation.y=t*.35; this.ring.rotation.z=t*.12; this.mol.rotation.y=-t*.05; this.pts.rotation.y=t*.01; }
    const act=this.focus>=0?this.focus:Math.floor(t/1.6)%5;
    this.nodes.forEach((m,i)=>{ const s=i===act?1.8:1; this.scaleV.set(s,s,s); m.scale.lerp(this.scaleV,.08); m.material.emissiveIntensity+=((i===act?1.3:.3)-m.material.emissiveIntensity)*.08; });
    this.renderer.render(this.scene,this.cam); },
  start(){ if(this.running||!this.renderer) return; this.running=true;
    const step=now=>{ if(!this.host||!this.host.isConnected||!this.visible||document.hidden){ this.running=false; return; }
      this.frame(now); if(sinMovimiento()){ this.frame(now+16); this.running=false; return; } requestAnimationFrame(step); };
    requestAnimationFrame(step); }
};

/* Etapa del ciclo según los datos reales de la droguería */
const ETAPAS=[['Registrar','#0B7A66'],['Medir','#0284C7'],['Analizar','#4F46E5'],['Mejorar','#EA580C'],['Volver a medir','#C026D3']];
function etapaActual(){
  const u=ultimoDiag();
  if(!u) return [0,'Aún no hay diagnóstico: registra tu línea base.'];
  if(data.acciones.some(a=>a.estado==='Cerrada'&&a.cierre&&a.cierre>u.fecha)) return [4,'Cerraste mejoras después del último diagnóstico: vuelve a medir.'];
  const abiertas=data.acciones.filter(a=>a.estado!=='Cerrada').length;
  if(abiertas) return [3,`Tienes ${abiertas} mejora(s) en marcha.`];
  if(u.eval.ob.no.length) return [2,'Hay incumplimientos por analizar y convertir en mejoras.'];
  if(!data.vencimientos.length&&!data.residuos.length) return [1,'Registra vencimientos y residuos para empezar a medir.'];
  return [1,'Sigue registrando cada mes para medir la evolución.'];
}
function cicloHTML(k){ return `<div class="cyc">${ETAPAS.map(([n,c],i)=>`<span class="cyc-s ${i===k?'on':i<k?'past':''}" style="--c:${c}"><i></i>${n}</span>`).join('')}</div>`; }

/* Inclinación 3D y brillo del cursor (solo escritorio) */
function tilt(el,max=7){ if(MOBILE||sinMovimiento()||el._tilt) return; el._tilt=1;
  el.addEventListener('pointermove',e=>{ const r=el.getBoundingClientRect(), x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
    el.style.transform=`perspective(900px) rotateX(${(.5-y)*max}deg) rotateY(${(x-.5)*max}deg)`; el.style.setProperty('--mx',x*100+'%'); el.style.setProperty('--my',y*100+'%'); });
  el.addEventListener('pointerleave',()=>{ el.style.transform=''; }); }
if(!MOBILE){ const g=document.createElement('div'); g.className='cursor-glow'; g.setAttribute('aria-hidden','true'); document.body.appendChild(g);
  let gx=0,gy=0,raf=0; addEventListener('pointermove',e=>{ gx=e.clientX; gy=e.clientY; if(!raf) raf=requestAnimationFrame(()=>{ g.style.transform=`translate(${gx}px,${gy}px)`; raf=0; }); },{passive:true}); }

/* Medidor circular de días restantes */
function gaugeHTML(x,e,d){ const col={vencido:'var(--danger)',proximo:'var(--warn)',vigente:'var(--ok)',gestionado:'var(--ink-2)',sinfecha:'var(--ink-2)'}[e];
  const frac=e==='gestionado'||e==='sinfecha'?1:d<0?1:Math.max(.04,Math.min(1,1-d/180)), C=2*Math.PI*22;
  const lbl=e==='gestionado'?'✓':e==='sinfecha'?'?':d<0?`${-d}d`:`${d}d`;
  return `<div class="gauge" aria-hidden="true"><svg viewBox="0 0 54 54"><circle class="bg" cx="27" cy="27" r="22"/><circle class="fg" cx="27" cy="27" r="22" stroke="${col}" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-off="${C*(1-frac)}"/></svg><b>${lbl}</b></div>`; }
function animarGauges(root){ root.querySelectorAll('.gauge .fg').forEach(c=>{ const off=c.dataset.off; if(sinMovimiento()) c.style.strokeDashoffset=off; else requestAnimationFrame(()=>requestAnimationFrame(()=>c.style.strokeDashoffset=off)); }); }

/* Línea de tiempo de la alarma */
function alarmaTimeline(u){ const MIN=-60, MAX=Math.max(200,u+40), X=d=>((Math.max(MIN,Math.min(MAX,d))-MIN)/(MAX-MIN))*100;
  const pend=data.vencimientos.filter(v=>destinoDe(v)==='Pendiente de gestión'&&v.fecha);
  const pins=pend.map(v=>{ const d=diasRestantes(v.fecha), e=estadoVenc(v), c=e==='vencido'?'r':e==='proximo'?'w':'g';
    return `<span class="pin ${c}" style="left:${X(d)}%" title="${esc(v.producto||'Sin nombre')}: ${d<0?'vencido hace '+(-d)+' días':'vence en '+d+' días'}"></span>`; }).join('');
  return `<div class="tl"><div class="tl-axis"></div><div class="tl-past" style="width:${X(0)}%"></div><div class="tl-zone" style="left:${X(0)}%;width:${X(u)-X(0)}%"></div><div class="tl-today" style="left:${X(0)}%"><span>Hoy</span></div>${pins}</div>
    <div class="tl-scale"><span>Hace 60 días</span><span>Ventana de ${u} días</span><span>+${MAX} días</span></div>`; }

/* Comparación antes / después deslizable */
function compareNode(b,u){
  const k=(v,l)=>`<div class="k"><b>${v}</b><span>${l}</span></div>`;
  const cerradas=data.acciones.filter(a=>a.estado==='Cerrada').length;

function vNormativa(v){
  v.appendChild(node(`<p class="muted" style="margin:0 0 14px;max-width:70ch">Normativa aplicable a la gestión farmacéutica, residuos y operación de droguerías en Colombia, según el plan de negocios (verificada a septiembre de 2026). Pasa el cursor sobre cada año y ábrelo para ver qué aporta a FARMIX.</p>`));
  const tb=node(`<div class="toolbar"><span class="spacer"></span></div>`);
  tb.appendChild(mkBtn(lawFlat?'Vista en perspectiva':'Vista plana','btn-soft btn-sm',()=>{ lawFlat=!lawFlat; render(); })); v.appendChild(tb);
  const sc=node(`<div class="card law-card"><div class="law-scene ${lawFlat||sinMovimiento()?'flat':''}"><div class="law-track"><div class="law-rail"></div></div></div><div class="law-list"></div></div>`);
  const tr=sc.querySelector('.law-track'), li=sc.querySelector('.law-list');
  LEYES.forEach((l,i)=>{ const x=6+i/(LEYES.length-1)*88;
    const b=node(`<button class="law-node" style="left:${x}%;--c:${l.c};--z:${36+(i%3)*18}px;--h:${40+(i%3)*18}px" aria-label="${esc(l.n)}"><span class="pillar"></span><span class="orb">${l.y}</span><span class="law-tip"><b>${esc(l.n)}</b><span class="muted">${l.y} · ${l.k}</span><br>${esc(l.d)}</span></button>`);
    b.onclick=()=>abrirLey(i); tr.appendChild(b);
    const m=node(`<button class="law-li" style="--c:${l.c}"><b>${l.y}</b> ${esc(l.n)}<br><span class="muted small">${esc(l.d)}</span></button>`); m.onclick=()=>abrirLey(i); li.appendChild(m); });
  v.appendChild(sc);
  v.appendChild(node(`<div class="card madurez-note"><span class="tag t-prop">Propuesta propia de FARMIX</span><div><b>Criterios de madurez de gestión</b><p class="muted small" style="margin:4px 0 0">Buenas prácticas para medir y mejorar. No son una exigencia legal; así se diferencian de los requisitos obligatorios del diagnóstico.</p></div></div>`));
  v.appendChild(node(`<div class="law-warn">${icon('alert')}<span>FARMIX realiza una autoevaluación orientativa. No emite conceptos de cumplimiento ni reemplaza la inspección de la autoridad sanitaria.</span></div>`));
}

/* ================= Inicio ================= */
(async function init(){ const u=await sesionValida(); if(u) abrirSesion(u); else { SS.removeItem(SESSION_KEY); render(); } })();
</script>
