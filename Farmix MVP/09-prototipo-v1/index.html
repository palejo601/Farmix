<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FARMIX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF2F0; --surface:#FFFFFF; --surface-2:#F5F8F7; --ink:#10292B; --ink-2:#56696B; --line:#DDE6E3;
  --primary:#0B7A66; --primary-2:#085E4F; --primary-soft:#D6F0E8;
  --warn:#B8740F; --warn-soft:#FBEFD8; --danger:#C62F4B; --danger-soft:#FBE3E8; --ok:#1C8456; --ok-soft:#DCF2E6;
  --neutral-soft:#E8EEEC; --grey-bar:#9AABA8;
  --shadow:0 1px 2px rgba(16,41,43,.05),0 10px 30px rgba(16,41,43,.07);
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C1A1B; --surface:#132527; --surface-2:#182E30; --ink:#E9F1EF; --ink-2:#9DB2AF; --line:#24403F;
  --primary:#35B89C; --primary-2:#5BCDB3; --primary-soft:#123A33; --warn:#E3A340; --warn-soft:#3A2C12;
  --danger:#F0647D; --danger-soft:#3D1A22; --ok:#4CC58A; --ok-soft:#133526; --neutral-soft:#1C3334; --grey-bar:#5E7674;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#0C1A1B; --surface:#132527; --surface-2:#182E30; --ink:#E9F1EF; --ink-2:#9DB2AF; --line:#24403F;
  --primary:#35B89C; --primary-2:#5BCDB3; --primary-soft:#123A33; --warn:#E3A340; --warn-soft:#3A2C12;
  --danger:#F0647D; --danger-soft:#3D1A22; --ok:#4CC58A; --ok-soft:#133526; --neutral-soft:#1C3334; --grey-bar:#5E7674;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Estructura */
.app{display:flex;min-height:100%}
.sidebar{width:236px;flex-shrink:0;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 22px}
.brand-mark{width:34px;height:34px;border-radius:11px;background:var(--accent);display:grid;place-items:center;color:#fff}
.brand b{font-size:1.15rem;font-weight:800;letter-spacing:-.02em}
.brand small{display:block;font-size:.72rem;color:var(--ink-2);font-weight:500;margin-top:-2px}
.main-col{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.topbar h1{margin:0;font-size:1.4rem;font-weight:800;letter-spacing:-.025em}
.topbar .sub{font-size:.8rem;color:var(--ink-2);font-weight:500}
.top-actions{display:flex;gap:8px}
.icon-btn{position:relative;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.icon-btn:hover{border-color:var(--accent)}
.badge{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--danger);color:#fff;font-size:.7rem;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg)}
.badge.warn{background:var(--warn)}
main{padding:4px 28px 40px;max-width:1080px;width:100%}
.tabbar{display:none}

@media (max-width:820px){
  .sidebar{display:none}
  .topbar{padding:14px 16px}
  .topbar h1{font-size:1.25rem}
  main{padding:4px 16px calc(96px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
}

/* Componentes */
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:1.05rem;font-weight:800;letter-spacing:-.01em}
.card .desc{color:var(--ink-2);font-size:.85rem;margin:0 0 14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-size:.88rem}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{filter:brightness(.92)}
.btn-soft{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn-soft:hover{border-color:var(--accent)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-sm{padding:7px 11px;font-size:.8rem;border-radius:10px}
.link{border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer;padding:0;font-size:inherit}
.muted{color:var(--ink-2)}
.small{font-size:.8rem}
.note{font-size:.78rem;color:var(--ink-2);background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px;margin-top:12px}

.hero{background:linear-gradient(135deg,var(--accent) 0%,var(--accent-2) 100%);color:#fff;border-radius:24px;padding:22px;margin-bottom:16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero .name{font-size:.85rem;opacity:.85;font-weight:600}
.hero .big{font-size:1.6rem;font-weight:800;letter-spacing:-.03em;margin:4px 0 16px;line-height:1.2;max-width:34ch}
.hero-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;position:relative;z-index:1}
.hero-stat{background:rgba(255,255,255,.12);border-radius:14px;padding:12px 14px}
.hero-stat .n{font-size:1.45rem;font-weight:800;letter-spacing:-.02em}
.hero-stat .l{font-size:.75rem;opacity:.85}
.hero .btn{background:#fff;color:var(--accent)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);padding:16px}
.kpi .n{font-size:1.35rem;font-weight:800;letter-spacing:-.02em}
.kpi .l{font-size:.78rem;color:var(--ink-2);margin-top:2px}
.kpi.bad .n{color:var(--danger)} .kpi.warn .n{color:var(--warn)} .kpi.good .n{color:var(--ok)}

.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.quick button{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:var(--r-md);padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:.8rem;cursor:pointer;color:var(--ink)}
.quick button .qi{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.quick button:hover{outline:2px solid var(--accent-soft)}

.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:.74rem;font-weight:700;white-space:nowrap}
.pill.bad{background:var(--danger-soft);color:var(--danger)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.neutral{background:var(--neutral-soft);color:var(--ink-2)}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;color:var(--ink-2)}
.search input{border:0;background:none;outline:none;padding:11px 0;width:100%;color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.8rem;font-weight:700;cursor:pointer;white-space:nowrap;color:var(--ink-2)}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip .c{opacity:.7;margin-left:4px}

.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;border-left:4px solid transparent}
.item.bad{border-left-color:var(--danger)} .item.warn{border-left-color:var(--warn)} .item.done{opacity:.75}
.item .t{font-weight:700}
.item .meta{font-size:.8rem;color:var(--ink-2)}
.item .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.item .val{font-weight:800}
.item-foot{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}
.item-foot select{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:6px 8px;font-size:.8rem;max-width:100%}
.del{border:0;background:none;color:var(--ink-2);cursor:pointer;padding:6px;border-radius:8px;margin-left:auto}
.del:hover{color:var(--danger);background:var(--danger-soft)}
.empty{text-align:center;padding:30px 16px;color:var(--ink-2)}
.empty .btn{margin-top:12px}

.segment{display:flex;background:var(--surface);border-radius:14px;padding:4px;gap:4px;box-shadow:var(--shadow);margin-bottom:16px;overflow-x:auto}
.segment button{flex:1;border:0;background:none;padding:10px 12px;border-radius:10px;font-weight:700;font-size:.82rem;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.segment button.active{background:var(--accent);color:#fff}

.progress{height:8px;background:var(--neutral-soft);border-radius:99px;overflow:hidden;margin:6px 0 14px}
.progress div{height:100%;background:var(--accent);border-radius:99px;transition:width .25s}

.q{padding:14px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.q .qt{font-weight:600;font-size:.92rem}
.q .qf{font-size:.74rem;color:var(--ink-2);margin-top:3px}
.opts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:700;font-size:.8rem;cursor:pointer;color:var(--ink-2)}
.opt.si{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.opt.no{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.opt.na{background:var(--neutral-soft);border-color:var(--ink-2);color:var(--ink)}
.area-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.score{font-weight:800;font-size:.85rem;background:var(--accent-soft);color:var(--accent);padding:4px 10px;border-radius:99px}
.sticky-save{position:sticky;bottom:12px;display:flex;justify-content:flex-end;margin-top:8px;z-index:5}
@media (max-width:820px){.sticky-save{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
th{color:var(--ink-2);font-weight:700;font-size:.76rem}
td.up{color:var(--ok);font-weight:700} td.down{color:var(--danger);font-weight:700}

.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--ink-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.split{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--neutral-soft);margin:10px 0}
.split div{height:100%}

/* Hojas emergentes */
#overlay{position:fixed;inset:0;z-index:50;display:none}
#overlay.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(8,20,21,.45);animation:fade .18s ease}
.sheet{position:absolute;background:var(--surface);box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;max-height:100%}
.sheet.side{top:0;right:0;bottom:0;width:min(420px,100%);border-radius:24px 0 0 24px;animation:slideL .22s ease}
.sheet.center{left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,94vw);max-height:90vh;border-radius:24px;animation:pop .2s ease}
@media (max-width:820px){ .sheet.side,.sheet.center{left:0;right:0;bottom:0;top:auto;width:100%;max-height:88vh;transform:none;border-radius:24px 24px 0 0;animation:slideU .22s ease} }
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 8px}
.sheet-head h3{margin:0;font-size:1.1rem;font-weight:800}
.sheet-body{padding:6px 20px 20px;overflow-y:auto}
.sheet-foot{padding:12px 20px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
@keyframes fade{from{opacity:0}} @keyframes slideL{from{transform:translateX(40px);opacity:0}} @keyframes slideU{from{transform:translateY(40px);opacity:0}} @keyframes pop{from{opacity:0;transform:translate(-50%,-47%)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
@media (max-width:520px){.form{grid-template-columns:1fr}}
.field label{display:block;font-size:.78rem;font-weight:700;color:var(--ink-2);margin-bottom:5px}
.field input,.field select{width:100%;border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;padding:11px 12px;color:var(--ink)}
.field input:focus,.field select:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.alarm-item{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.alarm-item:last-child{border-bottom:0}
.section-label{font-size:.8rem;font-weight:800;color:var(--ink-2);margin:16px 0 4px}

#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:14px;font-weight:700;font-size:.85rem;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (max-width:820px){#toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}}
.demo-flag{display:flex;align-items:center;gap:10px;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:.8rem;font-weight:700;margin-bottom:14px}

/* Reporte */
.report h3{font-size:.95rem;margin:20px 0 6px;font-weight:800}
.report h3:first-child{margin-top:0}
.report p{margin:4px 0;font-size:.88rem}
@media print{
  .sidebar,.tabbar,.topbar,.no-print,#overlay,#toast{display:none!important}
  body{background:#fff} main{padding:0} .card{box-shadow:none;border:1px solid #ccc}
}

body{--accent:#0B7A66;--accent-2:#0E5E6E}
body[data-sec="inicio"]{--accent:#0B7A66;--accent-2:#0E5E6E}
body[data-sec="diagnostico"]{--accent:#4F46E5;--accent-2:#7C3AED}
body[data-sec="vencimientos"]{--accent:#0284C7;--accent-2:#0E7490}
body[data-sec="residuos"]{--accent:#EA580C;--accent-2:#D97706}
body[data-sec="reporte"]{--accent:#C026D3;--accent-2:#7C3AED}
body{--accent-soft:color-mix(in srgb,var(--accent) 15%,var(--surface))}
.nav-btn{display:flex;align-items:center;gap:12px;border:0;background:none;padding:8px 10px;border-radius:14px;color:var(--ink-2);font-weight:700;cursor:pointer;text-align:left;width:100%}
.nav-btn .ni{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.nav-btn:hover{background:var(--surface-2);color:var(--ink)}
.nav-btn.active{background:var(--surface);color:var(--c);box-shadow:var(--shadow)}
.nav-btn.active .ni{background:var(--c);color:#fff}
.sidebar .spacer{flex:1}
.side-user{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);font-weight:700;font-size:.85rem;overflow:hidden}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#4F46E5,#C026D3);color:#fff;display:grid;place-items:center;font-weight:800;flex-shrink:0}
.avatar.big{width:44px;height:44px;font-size:1.1rem}
.tb-left{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.topbar h1{display:flex;align-items:center;gap:10px}
.title-ic{width:34px;height:34px;border-radius:11px;background:var(--accent);color:#fff;display:grid;place-items:center}
.drog-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px 5px 8px;font-weight:700;font-size:.8rem;cursor:pointer;color:var(--ink);max-width:100%}
.drog-chip:empty{display:none}
.drog-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw}
.drog-chip svg{width:16px;height:16px;color:var(--accent)}
.drog-chip em{font-style:normal;background:var(--accent);color:#fff;border-radius:99px;padding:0 6px;font-size:.7rem}
.drog-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1.5px solid var(--line);cursor:pointer;background:var(--surface)}
.drog-item.active{border-color:var(--accent);background:var(--accent-soft)}
.drog-item .t{font-weight:800}
.drog-item .meta{font-size:.78rem;color:var(--ink-2)}
.drog-av{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;display:grid;place-items:center;font-weight:800;flex-shrink:0}
#auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 20%,rgba(79,70,229,.18),transparent 45%),radial-gradient(circle at 85% 80%,rgba(234,88,12,.16),transparent 45%),radial-gradient(circle at 80% 15%,rgba(2,132,199,.16),transparent 40%),var(--bg)}
#auth[hidden],.app[hidden],.tabbar[hidden]{display:none!important}
.auth-card{width:min(420px,100%);background:var(--surface);border-radius:26px;box-shadow:var(--shadow);padding:28px}
.auth-card h2{margin:0;font-size:1.4rem;font-weight:800;letter-spacing:-.02em}
.auth-err{color:var(--danger);font-size:.82rem;font-weight:700;min-height:1.2em;margin:10px 0 6px}
.pass{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;padding-right:12px}
.pass input{border:0!important;background:none!important}
.det summary{cursor:pointer;font-weight:700;margin-top:12px;color:var(--accent)}
@media (max-width:820px){
  .tab-btn{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 2px;font-size:.66rem;font-weight:700;color:var(--ink-2);cursor:pointer}
  .tab-btn .ni{width:40px;height:30px;border-radius:12px;display:grid;place-items:center;color:var(--c);transition:background .15s}
  .tab-btn.active{color:var(--c)}
  .tab-btn.active .ni{background:var(--c);color:#fff}
  .drog-chip span{max-width:40vw}
}

/* Logo */
.brand-mark{background:none!important;width:40px;height:40px}
.logo{width:40px;height:40px;display:block;filter:drop-shadow(0 6px 14px rgba(2,132,199,.28))}
.logo .lf rect{transform-box:fill-box;transform-origin:0 50%;animation:growX .55s cubic-bezier(.2,.9,.25,1.1) both}
.logo .lf rect:first-child{transform-origin:50% 0;animation-name:growY}
.logo .lf rect:nth-child(2){animation-delay:.12s} .logo .lf rect:nth-child(3){animation-delay:.2s}
.logo .lx{transform-box:fill-box;transform-origin:center;animation:xIn .5s cubic-bezier(.3,1.5,.5,1) both}
.logo .lx1{animation-delay:.3s} .logo .lx2{animation-delay:.42s}
@keyframes growX{from{transform:scaleX(0)}} @keyframes growY{from{transform:scaleY(0)}}
@keyframes xIn{from{transform:scale(0) rotate(-120deg);opacity:0}}
.brand b{background:linear-gradient(90deg,#0B7A66,#0284C7 55%,#4F46E5);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes barUp{from{transform:scaleY(0)}}
@keyframes plusIn{from{transform:scale(0) rotate(-90deg);opacity:0}}
/* Entrada de pantallas */
#view.enter>*{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
#view.enter>*:nth-child(2){animation-delay:.05s} #view.enter>*:nth-child(3){animation-delay:.1s} #view.enter>*:nth-child(4){animation-delay:.15s} #view.enter>*:nth-child(n+5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
/* Interacción */
.btn,.chip,.opt,.quick button,.icon-btn,.nav-btn,.tab-btn{transition:transform .12s ease,filter .15s,background .2s,color .2s,box-shadow .2s}
.btn:active,.chip:active,.opt:active,.quick button:active,.icon-btn:active{transform:scale(.96)}
@media (hover:hover){ .card,.kpi,.item,.quick button,.tip{transition:transform .2s ease,box-shadow .2s ease}
  .kpi:hover,.item:hover,.quick button:hover,.tip:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(16,41,43,.06),0 16px 36px rgba(16,41,43,.11)} }
.opt.si,.opt.no,.opt.na{animation:optPop .22s ease}
@keyframes optPop{50%{transform:scale(1.07)}}
.quick button:hover .qi{transform:rotate(-6deg) scale(1.06)} .quick .qi{transition:transform .2s}
.badge.pulse{animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(198,47,75,.55)}70%{box-shadow:0 0 0 9px rgba(198,47,75,0)}100%{box-shadow:0 0 0 0 rgba(198,47,75,0)}}
.icon-btn.ring svg{animation:ring 2.6s ease-in-out infinite;transform-origin:50% 10%}
@keyframes ring{0%,80%,100%{transform:rotate(0)}84%{transform:rotate(14deg)}88%{transform:rotate(-12deg)}92%{transform:rotate(8deg)}96%{transform:rotate(-4deg)}}
.gb{transform-box:fill-box;transform-origin:50% 100%;animation:barUp .7s cubic-bezier(.2,.8,.2,1) both}
.hero::before{content:"";position:absolute;left:-40px;bottom:-80px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.06);animation:float 9s ease-in-out infinite}
.hero::after{animation:float 11s ease-in-out infinite reverse}
@keyframes float{50%{transform:translate(18px,-14px)}}
/* Carteles */
.tips{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 12px;margin-bottom:6px;scrollbar-width:none}
.tips::-webkit-scrollbar{display:none}
.tip{--t:var(--accent);position:relative;flex:0 0 min(300px,84%);scroll-snap-align:start;background:var(--surface);border-radius:18px;padding:16px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;gap:6px}
.tip::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--t)}
.tip.danger{--t:var(--danger)} .tip.warn{--t:#E08A00} .tip.info{--t:#0284C7} .tip.ok{--t:var(--ok)}
.tips.single{display:block} .tips.single .tip{flex:none;width:100%}
.tip.solo{flex-direction:row;align-items:center;gap:12px;margin-bottom:14px}
.tip-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--t);background:color-mix(in srgb,var(--t) 14%,transparent);flex-shrink:0}
.tip-t{font-weight:800;padding-right:26px}
.tip-x2{font-size:.84rem;color:var(--ink-2)}
.tip-b{align-self:flex-start;margin-top:4px;background:var(--t);color:#fff}
.tip-x{position:absolute;top:10px;right:10px;border:0;background:none;color:var(--ink-2);cursor:pointer;padding:4px;border-radius:8px}
.tip-x:hover{background:var(--surface-2)} .tip-x svg{width:16px;height:16px}
.tip.out{opacity:0;transform:scale(.95);transition:all .25s}
/* Guía */
.guia{text-align:center;padding:6px 4px 4px}
.guia-ic{width:84px;height:84px;margin:4px auto 14px;border-radius:26px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#000));animation:plusIn .45s cubic-bezier(.3,1.5,.5,1) both}
.guia-ic svg{width:40px;height:40px}
.guia h3{margin:0 0 6px;font-size:1.15rem;font-weight:800}
.dots{display:flex;gap:6px;justify-content:center;margin-top:16px}
.dots span{width:8px;height:8px;border-radius:99px;background:var(--line);transition:all .25s}
.dots span.on{width:26px;background:var(--c)}
/* Celebración */
.confeti{position:fixed;left:50%;top:32%;z-index:80;pointer-events:none}
.confeti i{position:absolute;width:9px;height:14px;border-radius:3px;animation:conf 1.4s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes conf{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
/* Auth con logo animado */
#auth .brand-mark .logo{width:46px;height:46px}

/* ================= Fusión con la experiencia ================= */
:root{
  --bg:#EEF4F3; --surface:rgba(255,255,255,.78); --surface-2:rgba(245,249,248,.9); --ink:#0B2328; --ink-2:#4A6266; --line:rgba(11,35,40,.12);
  --glass-line:rgba(11,35,40,.09); --display:'Sora',var(--font);
  --shadow:0 1px 1px rgba(11,35,40,.04),0 18px 44px -20px rgba(11,35,40,.3);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#08171B; --surface:rgba(18,44,50,.62); --surface-2:rgba(22,52,59,.85); --ink:#E6F2F0; --ink-2:#93ACAA; --line:rgba(230,242,240,.10); --glass-line:rgba(160,230,215,.12);
  --shadow:0 1px 1px rgba(0,0,0,.3),0 24px 60px -24px rgba(0,0,0,.65);
}}
:root[data-theme="dark"]{ --bg:#08171B; --surface:rgba(18,44,50,.62); --surface-2:rgba(22,52,59,.85); --ink:#E6F2F0; --ink-2:#93ACAA; --line:rgba(230,242,240,.10); --glass-line:rgba(160,230,215,.12); }
body{background:var(--bg)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 600px at 90% -10%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 60%),radial-gradient(700px 500px at -10% 40%,rgba(90,79,224,.10),transparent 60%),
  linear-gradient(var(--line) 1px,transparent 1px) 0 0/100% 64px;-webkit-mask-image:linear-gradient(#000,transparent 80%);mask-image:linear-gradient(#000,transparent 80%);transition:background .6s}
.app,#auth{position:relative;z-index:1}
.demo-flag{flex-wrap:wrap}.demo-flag>span:first-of-type{flex:1 1 55%}
.card,.kpi,.item,.quick button,.tip,.side-user,.drog-item,.segment,.search,.chip,.icon-btn,.drog-chip,.nav-btn.active{background:var(--surface);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%)}
.chip.active{background:var(--accent);border-color:var(--accent)}
.sheet{background:var(--surface-2);-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);border:1px solid var(--glass-line)}
.topbar h1,.card h2,.hero .big,.kpi .n,.hero-stat .n,.auth-card h2,.brand b,.guia h3,.sheet-head h3,.yr,.item .val,.score,.drog-item .t{font-family:var(--display);letter-spacing:-.02em}
.topbar h1{font-weight:600}
.kpi,.quick button{transform-style:preserve-3d;position:relative;overflow:hidden}
.kpi::after,.quick button::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(360px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--accent) 14%,transparent),transparent 45%);opacity:0;transition:opacity .3s}
.kpi:hover::after,.quick button:hover::after{opacity:1}
.cursor-glow{position:fixed;left:0;top:0;width:340px;height:340px;margin:-170px 0 0 -170px;border-radius:50%;pointer-events:none;z-index:0;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 12%,transparent),transparent 60%)}

/* Etiquetas de estado */
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-sim{color:var(--warn);background:var(--warn-soft)} .t-law{color:#1B6FD1;background:rgba(27,111,209,.12)} .t-prop{color:#5A4FE0;background:rgba(90,79,224,.12)}
.t-hyp{color:var(--danger);background:var(--danger-soft)} .t-pend{color:var(--ink-2);border-color:var(--line)} .t-fact{color:var(--ok);background:var(--ok-soft)}

/* Escena 3D */
.s3d{position:relative;display:grid;place-items:center}
.s3d canvas{width:100%!important;height:100%!important;display:block}
.fb3d{width:70%;height:auto;opacity:.85}

/* Acceso cinematográfico */
#auth{display:block;padding:0}
.auth-wrap{min-height:100vh;min-height:100svh;display:grid;grid-template-columns:1.1fr minmax(320px,440px);gap:24px;align-items:center;max-width:1180px;margin:0 auto;padding:30px 24px}
.auth-intro h1{font-family:var(--display);font-size:clamp(3rem,8vw,6.2rem);font-weight:700;letter-spacing:-.045em;line-height:.92;margin:0;background:linear-gradient(100deg,#0B7A66,#0284C7 55%,#4F46E5);-webkit-background-clip:text;background-clip:text;color:transparent}
.auth-intro .slo{font-family:var(--display);font-weight:300;font-size:clamp(1.15rem,2.2vw,1.6rem);margin-top:10px}
.auth-intro .lead{color:var(--ink-2);margin-top:12px;max-width:44ch}
.auth-stage{width:min(520px,100%);aspect-ratio:1;margin:-10px auto -20px}
.auth-card{background:var(--surface-2);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%)}
.auth-status{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
@media (max-width:860px){ .auth-wrap{grid-template-columns:1fr;padding:20px 16px 40px;gap:8px} .auth-stage{width:min(300px,80%);margin:0 auto -30px} .auth-intro{text-align:center} .auth-intro .lead{margin-inline:auto} .auth-status{justify-content:center} }
.cine [data-in]{opacity:0;filter:blur(14px);transform:translateY(20px) scale(.98)}
.cine.go [data-in]{opacity:1;filter:none;transform:none;transition:opacity 1s cubic-bezier(.2,.7,.1,1),filter 1s cubic-bezier(.2,.7,.1,1),transform 1s cubic-bezier(.2,.7,.1,1)}
.cine .auth-stage{opacity:0;transform:scale(.85)}
.cine.go .auth-stage{opacity:1;transform:none;transition:opacity 1.3s .25s ease,transform 1.7s .25s cubic-bezier(.16,1,.3,1)}

/* Inicio con 3D y ciclo */
.hero{display:grid;grid-template-columns:1fr 220px;gap:10px;align-items:center}
.hero>*{position:relative;z-index:1}
.hero-3d{width:220px;height:220px;margin:-20px -10px -20px 0}
@media (max-width:820px){ .hero{grid-template-columns:1fr} .hero-3d{display:none} }
.cyc{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 14px}
.cyc-s{display:inline-flex;align-items:center;gap:7px;font-size:.74rem;font-weight:700;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.12);color:rgba(255,255,255,.72);transition:all .4s}
.cyc-s i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.45)}
.cyc-s.past{color:rgba(255,255,255,.9)} .cyc-s.past i{background:#fff}
.cyc-s.on{background:#fff;color:var(--c)} .cyc-s.on i{background:var(--c);animation:pulseDot 1.8s infinite}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 60%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.cyc-note{font-size:.8rem;opacity:.85;margin:-6px 0 12px}

/* Medidores de vencimiento */
.vrow{display:flex;gap:12px;align-items:center;min-width:0}
.gauge{width:52px;height:52px;position:relative;flex-shrink:0}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge .bg{fill:none;stroke:var(--line);stroke-width:5}
.gauge .fg{fill:none;stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.7,.2,1)}
.gauge b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:.72rem;font-weight:600}

/* Línea de tiempo de la alarma */
.tl{position:relative;height:64px;margin:10px 4px 2px}
.tl-axis{position:absolute;left:0;right:0;top:31px;height:2px;background:var(--line)}
.tl-zone{position:absolute;top:18px;height:28px;border-radius:9px;background:var(--warn-soft);border:1px dashed color-mix(in srgb,var(--warn) 50%,transparent);transition:all .5s}
.tl-past{position:absolute;top:18px;height:28px;left:0;border-radius:9px;background:var(--danger-soft)}
.tl-today{position:absolute;top:8px;height:48px;width:2px;background:var(--ink)}
.tl-today span{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:.66rem;font-weight:800}
.pin{position:absolute;top:24px;width:16px;height:16px;margin-left:-8px;border-radius:50%;border:3px solid var(--surface-2);background:var(--ink-2)}
.pin.w{background:var(--warn);animation:pulsePin 2s infinite} .pin.r{background:var(--danger)} .pin.g{background:var(--ok)}
@keyframes pulsePin{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--warn) 60%,transparent)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
.tl-scale{display:flex;justify-content:space-between;font-size:.7rem;color:var(--ink-2);margin-bottom:6px}

/* Leyenda interactiva */
.legend button{border:0;background:none;display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:inherit;padding:3px 6px;border-radius:8px;font:inherit}
.legend button.off{opacity:.35}

/* Tablero de mejoras */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.col{padding:12px;border-radius:20px;background:color-mix(in srgb,var(--surface) 70%,transparent);border:1px dashed var(--line);min-height:120px}
.col h3{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-size:.95rem;margin:4px 4px 10px}
.col h3 span{font-size:.8rem;color:var(--ink-2)}
.icard{padding:13px;border-radius:15px;background:var(--surface-2);border:1px solid var(--glass-line);margin-bottom:10px;cursor:pointer;transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s;box-shadow:var(--shadow)}
.icard:hover{transform:translateY(-3px)}
.icard.late{border-color:var(--danger)}
.flow{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:.8rem}
.flow b{color:var(--ink-2);font-weight:600}
.icard .mv{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.icard.moved{animation:land .6s cubic-bezier(.2,1.3,.4,1)}
@keyframes land{from{transform:translateY(-18px) scale(.95);opacity:0}}
@media (max-width:900px){ .board{grid-template-columns:1fr} }

/* Antes / después */
.compare{position:relative;border-radius:22px;overflow:hidden;user-select:none;touch-action:pan-y;margin-bottom:16px;background:var(--surface);border:1px solid var(--glass-line)}
.cmp-layer{padding:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cmp-layer.after{position:absolute;inset:0;clip-path:inset(0 0 0 var(--cut,50%));background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 18%,var(--surface-2)),var(--surface-2))}
.cmp-layer .k b{font-family:var(--display);font-size:clamp(1.4rem,3vw,2.1rem);font-weight:600;display:block}
.cmp-layer .k span{font-size:.78rem;color:var(--ink-2)}
.cmp-title{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cmp-title b{font-family:var(--display);font-size:1.15rem}
.handle{position:absolute;top:0;bottom:0;left:var(--cut,50%);width:2px;background:var(--accent);transform:translateX(-1px)}
.handle span{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;box-shadow:var(--shadow)}
.compare input{position:absolute;inset:0;width:100%;opacity:0;cursor:ew-resize;margin:0}
@media (max-width:600px){ .cmp-layer{grid-template-columns:1fr 1fr;padding:16px} }

/* Recomendaciones con estructura */
.tip-k{display:block;font-size:.66rem;font-weight:800;color:var(--ink-2);margin-top:2px}

/* Normativa */
body[data-sec="normativa"]{--accent:#1D4ED8;--accent-2:#0E7490}
.law-card{padding:10px 0 14px;overflow:hidden}
.law-scene{perspective:1500px;padding:70px 0 10px}
.law-track{position:relative;height:220px;transform:rotateX(52deg) rotateZ(-4deg);transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.2,.7,.2,1);margin:0 30px}
.law-scene.flat .law-track{transform:none;height:150px}
.law-rail{position:absolute;left:0;right:0;top:108px;height:4px;border-radius:4px;background:linear-gradient(90deg,#1B6FD1,#0A8F77,#5A4FE0)}
.law-scene.flat .law-rail{top:72px}
.law-node{position:absolute;top:80px;transform:translateX(-50%);transform-style:preserve-3d;border:0;background:none;cursor:pointer;padding:0;color:inherit}
.law-scene.flat .law-node{top:44px}
.law-node .pillar{position:absolute;left:50%;bottom:28px;width:2px;height:var(--h,60px);background:linear-gradient(transparent,var(--c));transform:translateX(-50%) rotateX(-90deg);transform-origin:bottom}
.law-scene.flat .pillar{display:none}
.law-node .orb{width:56px;height:56px;border-radius:17px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.82rem;background:var(--surface-2);border:1px solid var(--glass-line);box-shadow:0 12px 30px -10px var(--c);transform:translateZ(var(--z,40px)) rotateX(-52deg);transition:transform .45s cubic-bezier(.2,1.2,.4,1);color:var(--c)}
.law-scene.flat .orb{transform:none}
.law-node:hover .orb,.law-node:focus-visible .orb{transform:translateZ(calc(var(--z,40px) + 26px)) rotateX(-52deg) scale(1.12)}
.law-scene.flat .law-node:hover .orb{transform:scale(1.1)}
.law-tip{position:absolute;bottom:calc(100% + 60px);left:50%;transform:translateX(-50%) rotateX(-52deg);width:220px;padding:11px 13px;border-radius:14px;opacity:0;pointer-events:none;transition:opacity .25s;text-align:left;font-size:.78rem;z-index:5;background:var(--surface-2);border:1px solid var(--glass-line);box-shadow:var(--shadow)}
.law-scene.flat .law-tip{transform:translateX(-50%);bottom:calc(100% + 8px)}
.law-node:hover .law-tip,.law-node:focus-visible .law-tip{opacity:1}
.law-tip b{font-family:var(--display);display:block;font-size:.85rem}
.law-list{display:none}
@media (max-width:820px){
  .law-scene{display:none} .law-card{padding:16px}
  .law-list{display:flex;flex-direction:column;gap:10px;position:relative;padding-left:24px}
  .law-list::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:linear-gradient(#1B6FD1,#0A8F77,#5A4FE0)}
  .law-li{position:relative;padding:13px 14px;border-radius:14px;text-align:left;cursor:pointer;border:1px solid var(--glass-line);background:var(--surface-2);color:inherit;font:inherit}
  .law-li::before{content:"";position:absolute;left:-22px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--c);border:3px solid var(--bg)}
  .law-li b{font-family:var(--display)}
}
.madurez-note{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-style:dashed}
.madurez-note b{font-family:var(--display)}
.law-warn{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-radius:16px;border:1px solid rgba(27,111,209,.35);background:rgba(27,111,209,.1);font-size:.88rem}
.law-warn svg{color:#1B6FD1;margin-top:1px}
.yr{font-size:3rem;font-weight:700;line-height:1}
.lawdl{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;margin:16px 0}
.lawdl dt{color:var(--ink-2);font-size:.8rem;font-weight:700}
.lawdl dd{margin:0;font-size:.9rem}
.sheet.law3d{animation:law3d .6s cubic-bezier(.16,1,.3,1)}
@keyframes law3d{from{opacity:0;transform:translate(-50%,-50%) perspective(1200px) rotateY(-18deg) rotateX(8deg) scale(.92)}}
@media (max-width:820px){ @keyframes law3d{from{opacity:0;transform:translateY(40px)}} }

@media (prefers-reduced-motion: reduce){ .cine [data-in],.cine .auth-stage{opacity:1!important;filter:none!important;transform:none!important} .law-track{transform:none!important} .law-node .orb{transform:none!important} .cursor-glow{display:none} }
@media print{ .cursor-glow,body::before{display:none} .card,.kpi{backdrop-filter:none;background:#fff} }
/* Personal y capacitaciones */
body[data-sec="personal"]{--accent:#0891B2;--accent-2:#0E7490}
.pers-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-bottom:18px}
.pers{padding:16px}
.pers-h{display:flex;align-items:center;gap:12px}
.pers-av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(135deg,#0891B2,#0B7A66);flex-shrink:0}
.pers-id{flex:1;min-width:0} .pers-id .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pers-pct{text-align:right;line-height:1.1} .pers-pct b{font-family:var(--display);font-size:1.15rem;display:block} .pers-pct span{font-size:.7rem;color:var(--ink-2)}
.pers .bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin:12px 0}
.pers .bar i{display:block;height:100%;background:linear-gradient(90deg,#0B7A66,#0891B2);border-radius:9px;transition:width .6s}
.pers-temas{display:flex;flex-direction:column;gap:6px}
.tcap{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);text-align:left;cursor:pointer;color:var(--ink);font:inherit;min-height:44px}
.tcap-ic svg{width:18px;height:18px} .tcap-t{font-size:.84rem;font-weight:600} .tcap-s{font-size:.72rem;font-weight:700;white-space:nowrap}
.tcap.ok{border-color:color-mix(in srgb,var(--ok) 35%,transparent)} .tcap.ok .tcap-ic,.tcap.ok .tcap-s{color:var(--ok)}
.tcap.warn .tcap-ic,.tcap.warn .tcap-s{color:var(--warn)} .tcap.bad .tcap-ic,.tcap.bad .tcap-s{color:var(--danger)} .tcap.neutral .tcap-ic,.tcap.neutral .tcap-s{color:var(--ink-2)}
.tbl-wrap{overflow-x:auto} .tbl{width:100%;border-collapse:collapse;font-size:.86rem} .tbl th{text-align:left;font-size:.74rem;color:var(--ink-2);padding:8px;border-bottom:1px solid var(--line);white-space:nowrap} .tbl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle} .tbl tr:hover td{background:var(--surface-2)}
.pill.neutral{background:var(--line);color:var(--ink-2)}
.chk-list{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto;padding:4px}
.chk{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);cursor:pointer;min-height:44px}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drop{display:flex;align-items:center;gap:10px;padding:16px;border-radius:14px;border:2px dashed var(--line);cursor:pointer;color:var(--ink-2);font-weight:600;font-size:.88rem}
.drop svg{width:20px;height:20px;color:var(--accent)} .drop.has{border-style:solid;border-color:var(--accent);color:var(--ink)}
.tema-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.kv-list{display:flex;flex-direction:column;gap:2px} .kv-list div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem} .kv-list span{color:var(--ink-2)}
.sop-box{margin-top:14px} .sop-file{display:flex;gap:10px;align-items:center;padding:12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)} .sop-file svg{width:22px;height:22px;color:var(--accent)} .sop-file div{display:flex;flex-direction:column}

/* Ventanas ajustadas a la pantalla visible del celular (barra del navegador incluida) */

.chk{align-items:flex-start} .chk input{margin-top:2px;flex-shrink:0} .chk-txt{display:flex;flex-direction:column;line-height:1.25} .chk-txt b{font-weight:600}

/* ================= Datos, cuentas y droguerías ================= */
// Versión local del MVP: las cuentas y los datos viven solo en este navegador (localStorage).
// La contraseña se guarda como hash con sal, pero esto NO es seguridad real: la versión final requiere un servidor con autenticación.
// Acceso seguro al almacenamiento: si el navegador lo bloquea, se usa memoria temporal.
const memStore=()=>{ const m={}; return {getItem:k=>k in m?m[k]:null,setItem:(k,v)=>{m[k]=String(v)},removeItem:k=>{delete m[k]}}; };
const LS=(()=>{ try{ const s=window.localStorage; s.setItem('__fx','1'); s.removeItem('__fx'); return s; }catch(e){ return memStore(); } })();
const SS=(()=>{ try{ const s=window.sessionStorage; s.setItem('__fx','1'); s.removeItem('__fx'); return s; }catch(e){ return memStore(); } })();
const USERS_KEY='farmix_users', META_KEY='farmix_meta', LEGACY_KEY='farmix_data_v1', SESSION_KEY='farmix_session';
const readJSON=(k,st=LS)=>{ try{ const r=st.getItem(k); return r? JSON.parse(r) : null; }catch(e){ return null; } };
const writeJSON=(k,v,st=LS)=>{ try{ st.setItem(k,JSON.stringify(v)); }catch(e){} };
let users=readJSON(USERS_KEY)||{}, user=null, store=null, data=null;
const storeKey=u=>'farmix_store_'+u;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function nuevaDrogueria(est){ return {id:uid(),establecimiento:est||{},config:{},residuos:[],vencimientos:[],acciones:[],diagnosticos:[],diagBorrador:{resp:{}}}; }
function migrar(){ if(!data) return;
  data.config=data.config||{}; data.residuos=data.residuos||[]; data.vencimientos=data.vencimientos||[];
  data.acciones=data.acciones||[]; data.diagnosticos=data.diagnosticos||[]; data.establecimiento=data.establecimiento||{};
  data.diagBorrador=data.diagBorrador||{resp:{}}; if(data.diagnostico) delete data.diagnostico; if(!data.id) data.id=uid(); migrarPersonal(); (data.residuos||[]).forEach(migrarClase); }
function seleccionar(){ const a=store.droguerias.find(d=>d.id===store.activeId)||store.droguerias[0]||null; store.activeId=a?a.id:null; data=a; migrar(); }
function save(){ if(user&&store) writeJSON(storeKey(user),store); }
function abrirSesion(u){
  user=u;
  store=readJSON(storeKey(u))||{droguerias:[],activeId:null};
  const meta=readJSON(META_KEY)||{};
  if(!meta.legacyImported){ const old=readJSON(LEGACY_KEY);
    if(old && (old.vencimientos||old.residuos||old.diagnosticos)){ const d=Object.assign(nuevaDrogueria(),old); d.id=uid(); delete d.demo;
      if(!d.establecimiento||!d.establecimiento.nombre) d.establecimiento=Object.assign({},d.establecimiento,{nombre:'Mi droguería'});
      if(!old.demo) store.droguerias.push(d); }
    meta.legacyImported=true; writeJSON(META_KEY,meta); }

}
async function cerrarSesion(){ authModo='login'; await revocarSesionActual(); SS.removeItem(SESSION_KEY); user=null; store=null; data=null; closeSheet(); render(); }
// Usuario normalizado: sin espacios extremos, en minúsculas y con los espacios internos convertidos en puntos
const normUser=v=>String(v||'').trim().toLowerCase().replace(/\s+/g,'.');
/* ================= Sesión verificada (PROTOTYPE T1) =================
   Antes: la sesión era solo el nombre de usuario en sessionStorage, y bastaba escribirlo para entrar.
   Ahora: al autenticarse se crea un token aleatorio; en sessionStorage queda {u, t} y en la cuenta solo
   el hash del token con su vencimiento. Al recargar, la sesión se acepta únicamente si el hash coincide
   y no ha vencido. Limitación conocida: sin servidor, quien pueda editar el almacenamiento del navegador
   aún puede alterar las cuentas; el control definitivo llega con el backend. */
const MIN_PASS=8, SES_TTL_MS=12*60*60*1000, SES_MAX=10;
const nuevoToken=()=>{ try{ return [...crypto.getRandomValues(new Uint8Array(32))].map(x=>x.toString(16).padStart(2,'0')).join(''); }catch(e){ return Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2)+Date.now().toString(36); } };
const hashToken=t=>hashPass(t,'farmix-sesion');
function limpiarSesiones(r){ const ahora=Date.now(); r.sesiones=(r.sesiones||[]).filter(x=>x&&x.exp>ahora).slice(-SES_MAX); }
async function iniciarSesion(u,{conservar}={}){ const r=users[u]; if(!r) return;
  const t=nuevoToken(); limpiarSesiones(r); r.sesiones.push({h:await hashToken(t),exp:Date.now()+SES_TTL_MS}); writeJSON(USERS_KEY,users);
  SS.setItem(SESSION_KEY,JSON.stringify({u,t})); abrirSesion(u); }
async function sesionValida(){ let s; try{ s=JSON.parse(SS.getItem(SESSION_KEY)||'null'); }catch(e){ s=null; }
  if(!s||typeof s!=='object'||typeof s.u!=='string'||typeof s.t!=='string') return null;
  const r=users[s.u]; if(!r) return null; limpiarSesiones(r); const h=await hashToken(s.t);
  return r.sesiones.some(x=>x.h===h)? s.u : null; }
async function revocarSesionActual(){ try{ const s=JSON.parse(SS.getItem(SESSION_KEY)||'null'); const r=s&&users[s.u]; if(r){ const h=await hashToken(s.t); r.sesiones=(r.sesiones||[]).filter(x=>x.h!==h); writeJSON(USERS_KEY,users); } }catch(e){} }
async function revocarOtrasSesiones(u){ try{ const s=JSON.parse(SS.getItem(SESSION_KEY)||'null'); const r=users[u]; if(!r) return; const h=s&&s.t?await hashToken(s.t):null; r.sesiones=(r.sesiones||[]).filter(x=>x.h===h); writeJSON(USERS_KEY,users); }catch(e){} }

/* ================= Respaldo (PROTOTYPE T3) =================
   Exporta los datos de la cuenta activa sin modificar ni borrar nada de localStorage, sessionStorage o IndexedDB.
   El respaldo no incluye hash, sal ni tokens de sesión. Lleva una huella SHA-256 para verificar su integridad. */
const RESPALDO_FORMATO='farmix-respaldo', RESPALDO_VERSION=1;
async function sha256Hex(txt){ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
const blobABase64=b=>new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result).split(',')[1]||''); fr.onerror=()=>rej(fr.error); fr.readAsDataURL(b); });
function base64ABlob(b64,tipo){ const bin=atob(b64), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new Blob([u],{type:tipo||'application/octet-stream'}); }
function resumenRespaldo(datos){ return (datos.droguerias||[]).map(d=>({id:d.id,nombre:(d.establecimiento||{}).nombre||'Sin nombre',demo:!!d.demo,
  vencimientos:(d.vencimientos||[]).length,residuos:(d.residuos||[]).length,mejoras:(d.acciones||[]).length,diagnosticos:(d.diagnosticos||[]).length,
  trabajadores:(d.personal||[]).length,capacitaciones:(d.capacitaciones||[]).length})); }
async function construirRespaldo(){ const u=users[user]||{};
  const datos=JSON.parse(JSON.stringify(store||{droguerias:[],activeId:null}));
  const ids=new Map(); (datos.droguerias||[]).forEach(d=>(d.capacitaciones||[]).forEach(c=>{ if(c.soporte&&c.soporte.id&&!c.soporte.demo) ids.set(c.soporte.id,c.soporte); }));
  const soportes=[], faltantes=[];
  for(const [id,meta] of ids){ const b=await Soportes.get(id); if(b) soportes.push({id,nombre:meta.nombre,tipo:meta.tipo||b.type||'',tamano:b.size,base64:await blobABase64(b)}); else faltantes.push({id,nombre:meta.nombre}); }
  const cuerpo={cuenta:{usuario:user,nombre:u.nombre||user,creado:u.creado||null},datos,soportes,soportesFaltantes:faltantes};
  const huella=await sha256Hex(JSON.stringify(cuerpo));
  return {formato:RESPALDO_FORMATO,version:RESPALDO_VERSION,generado:new Date().toISOString(),aplicacion:'FARMIX',entorno:'PROTOTYPE',
    ...cuerpo,resumen:resumenRespaldo(datos),integridad:{algoritmo:'SHA-256',huella}}; }
async function entregarArchivo(nombre,texto){
  // 1) Capacidad oficial de descargas de la plataforma (página publicada, o su marco padre si está incrustada)
  try{ const cl=window.claude||(window.parent!==window&&window.parent.claude); if(cl&&cl.use){ const dl=await cl.use('downloads'); if(dl){ await dl.save({filename:nombre,data:texto}); return 'guardado'; } } }catch(e){ if(e&&e.code==='declined') return 'rechazado'; }
  // 2) Descarga estándar del navegador (archivo local u hosting propio)
  try{ const url=URL.createObjectURL(new Blob([texto],{type:'application/json'})); const a=document.createElement('a'); a.href=url; a.download=nombre; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); return 'intentado'; }catch(e){ return 'fallo'; } }
async function exportarRespaldo(){
  let r; try{ r=await construirRespaldo(); }catch(e){ toast('No se pudo preparar el respaldo'); return; }
  const txt=JSON.stringify(r,null,1), nombre=`farmix-respaldo-${user}-${hoyISO()}.json`;
  const tot=r.resumen.reduce((a,d)=>({v:a.v+d.vencimientos,r:a.r+d.residuos,m:a.m+d.mejoras,g:a.g+d.diagnosticos,t:a.t+d.trabajadores,c:a.c+d.capacitaciones}),{v:0,r:0,m:0,g:0,t:0,c:0});
  const w=node(`<div><p class="muted small" style="margin-top:0">El respaldo contiene todos los datos de tu cuenta en este navegador. <b>No se modifica ni se borra nada</b> de lo guardado.</p>
    <div class="kv-list"><div><span>Droguerías</span><b>${r.resumen.length}</b></div><div><span>Vencimientos</span><b>${tot.v}</b></div><div><span>Residuos</span><b>${tot.r}</b></div><div><span>Mejoras</span><b>${tot.m}</b></div><div><span>Diagnósticos</span><b>${tot.g}</b></div><div><span>Trabajadores</span><b>${tot.t}</b></div><div><span>Capacitaciones</span><b>${tot.c}</b></div><div><span>Soportes incluidos</span><b>${r.soportes.length}${r.soportesFaltantes.length?` (faltan ${r.soportesFaltantes.length})`:''}</b></div><div><span>Tamaño</span><b>${(txt.length/1024).toFixed(0)} KB</b></div></div>
    <p class="muted small">Huella SHA-256: <code style="word-break:break-all">${r.integridad.huella}</code></p>
    <p class="muted small">Guárdalo en un lugar seguro: incluye nombres de trabajadores y sus certificados.</p>
    <textarea id="rs_txt" readonly style="width:100%;height:90px;font:12px ui-monospace,monospace;display:none"></textarea></div>`);
  openSheet({title:'Exportar respaldo',body:w,foot:[
    mkBtn(icon('down')+'Copiar respaldo','btn-soft',async()=>{ let ok=false; try{ await navigator.clipboard.writeText(txt); ok=true; }catch(e){} if(!ok){ const ta=w.querySelector('#rs_txt'); ta.style.display='block'; ta.value=txt; ta.focus(); ta.select(); try{ ok=document.execCommand('copy'); }catch(e){} } toast(ok?'Respaldo copiado':'Selecciona el texto y cópialo'); }),
    mkBtn(icon('down')+'Descargar archivo','btn-primary',async()=>{ const s=await entregarArchivo(nombre,txt); toast(s==='guardado'?'Respaldo guardado':s==='rechazado'?'Descarga cancelada':s==='intentado'?'Descarga iniciada':'Tu visor no permite descargar: usa Copiar respaldo'); })]}); }
async function validarRespaldo(txt){ let r; try{ r=JSON.parse(txt); }catch(e){ return {error:'El texto no es un respaldo válido (JSON dañado).'}; }
  if(!r||r.formato!==RESPALDO_FORMATO) return {error:'No es un respaldo de FARMIX.'};
  if(r.version!==RESPALDO_VERSION) return {error:`Versión de respaldo no compatible (${r.version}).`};
  if(!r.datos||!Array.isArray(r.datos.droguerias)) return {error:'El respaldo no contiene droguerías.'};
  const cuerpo={cuenta:r.cuenta,datos:r.datos,soportes:r.soportes||[],soportesFaltantes:r.soportesFaltantes||[]};
  let h; try{ h=await sha256Hex(JSON.stringify(cuerpo)); }catch(e){ return {error:'No se pudo verificar la huella en este navegador.'}; }
  if(!r.integridad||h!==r.integridad.huella) return {error:'La huella no coincide: el respaldo fue modificado o está incompleto.'};
  return {r}; }
function restaurarRespaldo(){
  const w=node(`<div><p class="muted small" style="margin-top:0">Agrega a tu cuenta las droguerías de un respaldo. <b>No reemplaza ni borra nada</b>: las droguerías que ya existen se omiten.</p>
    <label class="drop"><input type="file" id="rr_f" accept=".json,application/json" hidden>${icon('up')}<span id="rr_n">Elegir archivo de respaldo</span></label>
    <div class="field" style="margin-top:10px"><label for="rr_t">O pega el texto del respaldo</label><textarea id="rr_t" style="width:100%;height:80px;font:12px ui-monospace,monospace"></textarea></div>
    <div id="rr_res" class="muted small"></div></div>`);
  let valido=null; const res=w.querySelector('#rr_res');
  const revisar=async txt=>{ valido=null; const v=await validarRespaldo(txt); if(v.error){ res.innerHTML=`<p style="color:var(--danger);font-weight:600">${esc(v.error)}</p>`; return; }
    valido=v.r; const ex=new Set(store.droguerias.map(d=>d.id));
    res.innerHTML=`<p><b>Respaldo válido</b> · ${esc(v.r.generado.slice(0,10))} · cuenta ${esc(v.r.cuenta.usuario)}</p>`+v.r.resumen.map(d=>`<p>• ${esc(d.nombre)}${d.demo?' (demostración)':''}: ${d.vencimientos} vencimientos, ${d.residuos} residuos, ${d.capacitaciones} capacitaciones${ex.has(d.id)?' — <b>ya existe, se omitirá</b>':''}</p>`).join(''); };
  w.querySelector('#rr_f').onchange=async e=>{ const f=e.target.files[0]; if(!f) return; w.querySelector('#rr_n').textContent=f.name; revisar(await f.text()); };
  w.querySelector('#rr_t').oninput=e=>{ const t=e.target.value.trim(); if(t.length>20) revisar(t); };
  openSheet({title:'Restaurar respaldo',body:w,foot:[mkBtn('Restaurar','btn-primary',async()=>{ if(!valido){ toast('Primero elige un respaldo válido'); return; }
    const ex=new Set(store.droguerias.map(d=>d.id)); let n=0, om=0, fs=0;
    for(const s of valido.soportes||[]){ try{ if(!(await Soportes.get(s.id))){ await Soportes.put(s.id,base64ABlob(s.base64,s.tipo)); fs++; } }catch(e){} }
    valido.datos.droguerias.forEach(d=>{ if(ex.has(d.id)){ om++; return; } store.droguerias.push(JSON.parse(JSON.stringify(d))); n++; });
    if(!store.activeId&&store.droguerias.length) store.activeId=store.droguerias[0].id;
    seleccionar(); save(); closeSheet(); render(); toast(`${n} droguería(s) restaurada(s)${om?`, ${om} omitida(s)`:''}${fs?`, ${fs} soporte(s)`:''}`); })]}); }

async function hashPass(pass,salt){
  try{ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pass)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
  catch(e){ let h=2166136261; for(const ch of salt+':'+pass){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619); } return 'f'+(h>>>0).toString(16); }
}
const nuevaSal=()=>{ try{ return [...crypto.getRandomValues(new Uint8Array(12))].map(x=>x.toString(16).padStart(2,'0')).join(''); }catch(e){ return Math.random().toString(36).slice(2)+Date.now().toString(36); } };

/* ================= Utilidades ================= */
function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const money=n=>'$'+Math.round(n||0).toLocaleString('es-CO');
const kgf=n=>(Math.round((n||0)*10)/10).toLocaleString('es-CO')+' kg';
/* Fecha de HOY en la hora local del dispositivo. Antes usaba toISOString() (UTC): en Colombia, desde las 7 p. m.
   fechaba todo con el día siguiente y contradecía a diasRestantes(), que sí usa la hora local. */
const hoyISO=()=>{ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
function fechaRel(d){ const x=new Date(); x.setHours(12,0,0,0); x.setDate(x.getDate()+d); return x.toISOString().slice(0,10); }
function diasRestantes(f){ const h=new Date(); h.setHours(0,0,0,0); return Math.round((new Date(f+'T00:00:00')-h)/86400000); }
const fechaCorta=f=>{ try{ return new Date(f+'T12:00:00').toLocaleDateString('es-CO',{day:'numeric',month:'short',year:'numeric'}); }catch(e){ return f; } };
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200); }
function node(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; }

/* ================= Hojas emergentes ================= */
function openSheet({title, body, foot, side=false}){
  const ov=document.getElementById('overlay');
  ov.innerHTML=`<div class="scrim"></div><div class="sheet ${side?'side':'center'}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="sheet-head"><h3>${esc(title)}</h3><button class="icon-btn" data-close aria-label="Cerrar">${icon('x')}</button></div>
    <div class="sheet-body"></div>${foot?'<div class="sheet-foot"></div>':''}</div>`;
  const b=ov.querySelector('.sheet-body'); typeof body==='string'? b.innerHTML=body : b.appendChild(body);
  if(foot){ const f=ov.querySelector('.sheet-foot'); if(typeof foot==='string') f.innerHTML=foot; else foot.forEach(x=>f.appendChild(x)); }

/* ================= Reglas: vencimientos ================= */
function umbral(){ const u=Number(data.config.diasAlerta); return u>0?u:null; }
const DESTINOS=['Pendiente de gestión','Devuelto a proveedor','Destrucción por gestor autorizado','Avería o deterioro'];
const destinoDe=v=>DESTINOS.includes(v.destino)? v.destino : 'Pendiente de gestión';
function estadoVenc(v){
  if(destinoDe(v)!=='Pendiente de gestión') return 'gestionado';
  if(!v.fecha) return 'sinfecha';
  const d=diasRestantes(v.fecha); if(d<0) return 'vencido';
  const u=umbral(); if(u!==null && d<=u) return 'proximo'; return 'vigente';
}
function alertas(){ const venc=[],prox=[];
  data.vencimientos.forEach(v=>{ const e=estadoVenc(v); if(e==='vencido') venc.push(v); else if(e==='proximo') prox.push(v); });
  const by=(a,b)=>diasRestantes(a.fecha)-diasRestantes(b.fecha); return {venc:venc.sort(by),prox:prox.sort(by)}; }
/* Dinero en CENTAVOS ENTEROS (como el servidor). Antes se multiplicaba y sumaba en punto flotante y, en casos límite,
   el total quedaba una fracción por debajo del exacto: p. ej. 255.379,4999… se mostraba $255.379 en vez de $255.380. */
const centavos=v=>Math.round((+v.cantidad||0)*Math.round((+v.costo||0)*100));
const valorProducto=v=>centavos(v)/100;
function perdidas(){ let confirmada=0,recuperado=0,riesgo=0;
  data.vencimientos.forEach(v=>{ const val=centavos(v), d=destinoDe(v), e=estadoVenc(v);
    if(d==='Devuelto a proveedor') recuperado+=val; else if(d!=='Pendiente de gestión') confirmada+=val; else if(e==='vencido'||e==='proximo') riesgo+=val; });
  return {confirmada:confirmada/100,recuperado:recuperado/100,riesgo:riesgo/100}; }

const CLASES=['Riesgo biológico','Peligroso químico','Aprovechable','Orgánico aprovechable','No aprovechable'];
const COLOR_CLASE={'Riesgo biológico':'#D1283F','Peligroso químico':'#B7791F','Aprovechable':'#FFFFFF','Orgánico aprovechable':'#1E9E4A','No aprovechable':'#1F2328'};
const INFO_CLASE={'Riesgo biológico':['Bolsa o recipiente rojo','Agujas y cortopunzantes (en guardián), guantes, algodones o gasas con fluidos'],
  'Peligroso químico':['Sin bolsa de color: área de vencidos y entrega a gestor autorizado o programa posconsumo','Medicamentos vencidos o deteriorados, luminarias'],
  'Aprovechable':['Bolsa blanca','Cartón, papel, plástico, vidrio y metales limpios y secos'],
  'Orgánico aprovechable':['Bolsa verde','Restos de comida'],
  'No aprovechable':['Bolsa negra','Residuos de barrido, servilletas, empaques sucios']};
// Registros guardados con la clasificación anterior (3 categorías) → nueva clasificación
function migrarClase(r){ if(CLASES.includes(r.clasificacion)||!r.clasificacion) return;
  if(r.clasificacion==='No peligroso'){ r.clasificacion='No aprovechable'; return; }
  if(r.clasificacion==='Peligroso'){ r.clasificacion=/cortopunz|biosanit|aguja|jeringa|guante|infecc|biol/i.test(r.tipo||'')?'Riesgo biológico':'Peligroso químico'; r.revisarClase=true; } }
function kgDe(r){ const u=String(r.unidad||'').toLowerCase().trim(); if(u==='kg') return +r.cantidad||0; if(u==='g') return (+r.cantidad||0)/1000; return null; }
function porMes(n){ const meses=[]; const d=new Date(); d.setDate(1);
  for(let i=n-1;i>=0;i--){ const x=new Date(d); x.setMonth(d.getMonth()-i); meses.push(x.toISOString().slice(0,7)); }
  return meses.map(m=>{ const o={mes:m}; CLASES.forEach(c=>o[c]=0);
    data.residuos.forEach(r=>{ if((r.fecha||'').slice(0,7)!==m) return; const kg=kgDe(r); if(kg!=null && CLASES.includes(r.clasificacion)) o[r.clasificacion]+=kg; }); return o; }); }
function totalUnidades(){ return data.residuos.filter(r=>kgDe(r)==null).reduce((s,r)=>s+(+r.cantidad||0),0); }

function evaluarDiag(resp){
  const ob={cumple:0,no:[],na:0,sin:0,total:OBLIGATORIOS.length};
  OBLIGATORIOS.forEach(o=>{ const r=resp[o.id]; if(r==='si') ob.cumple++; else if(r==='no') ob.no.push(o.id); else if(r==='na') ob.na++; else ob.sin++; });
  ob.aplicables=ob.total-ob.na;
  const mad={}; MADUREZ.forEach(a=>{ let si=0,apl=0; a.items.forEach((_,i)=>{ const r=resp[a.id+'_'+i]; if(r==='si'){si++;apl++;} else if(r==='no') apl++; }); mad[a.id]=apl? Math.max(1,Math.round(si/apl*4)+1):null; });
  const vals=Object.values(mad).filter(v=>v!=null);
  return {ob,mad,prom: vals.length? +(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1):null};
}

/* ================= Gráficas ================= */
const ocultasRes=new Set();
document.addEventListener('click',e=>{ const b=e.target.closest('[data-res-toggle]'); if(!b) return; const c=b.dataset.resToggle;
  if(ocultasRes.has(c)) ocultasRes.delete(c); else if(ocultasRes.size<CLASES.length-1) ocultasRes.add(c); render(); });
function chartResiduos(meses){
  const W=600,H=210,pad=28,bw=(W-pad*2)/meses.length*0.56;
  const VIS=CLASES.filter(c=>!ocultasRes.has(c));
  const max=Math.max(1,...meses.map(m=>VIS.reduce((s,c)=>s+m[c],0)));
  let bars='';
  meses.forEach((m,i)=>{ const x=pad+(W-pad*2)/meses.length*(i+.5)-bw/2; let y=H-30;
    VIS.forEach(c=>{ const h=m[c]/max*(H-60); if(h>0){ bars+=`<rect class="gb" style="animation-delay:${i*60}ms" x="${x}" y="${y-h}" width="${bw}" height="${h}" rx="4" fill="${COLOR_CLASE[c]}" stroke="rgba(16,41,43,.35)" stroke-width="1"/>`; y-=h+2; } });
    const tot=VIS.reduce((s,c)=>s+m[c],0);
    if(tot) bars+=`<text x="${x+bw/2}" y="${y-6}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink-2)">${Math.round(tot)}</text>`;
    const lbl=new Date(m.mes+'-15').toLocaleDateString('es-CO',{month:'short'});
    bars+=`<text x="${x+bw/2}" y="${H-10}" text-anchor="middle" font-size="12" fill="var(--ink-2)">${lbl}</text>`; });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Residuos por mes en kilogramos">${bars}</svg>
    <div class="legend">${CLASES.map(c=>`<button data-res-toggle="${c}" class="${ocultasRes.has(c)?'off':''}" aria-pressed="${!ocultasRes.has(c)}"><i style="background:${COLOR_CLASE[c]};box-shadow:inset 0 0 0 1px rgba(16,41,43,.35)"></i>${c}</button>`).join('')}<span>kg por mes · toca para ocultar</span></div><p class="muted small" style="margin:6px 0 0">Colores según la Res. 2184 de 2019 (mod. Res. 1344 de 2020) y el manual de la Res. 591 de 2024. Los medicamentos vencidos no llevan bolsa de color: van al área de vencidos y al gestor o posconsumo.</p></div>`;
}

/* ================= Vista: Diagnóstico ================= */
let diagSeg='obligatorios';
function vDiagnostico(v){
  const segs=[['obligatorios','Obligatorios'],['madurez','Madurez'],['resultados','Resultados'],['mejoras','Mejoras']];
  const s=node(`<div class="segment">${segs.map(([id,l])=>`<button class="${diagSeg===id?'active':''}" data-s="${id}">${l}</button>`).join('')}</div>`);
  s.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ diagSeg=b.dataset.s; render(); });
  v.appendChild(s);
  if(diagSeg==='obligatorios'||diagSeg==='madurez') vPreguntas(v); else if(diagSeg==='resultados') vResultados(v); else vMejoras(v);
}
function vPreguntas(v){
  const resp=data.diagBorrador.resp, oblig=diagSeg==='obligatorios';
  const ids=oblig? OBLIGATORIOS.map(o=>o.id) : MADUREZ.flatMap(a=>a.items.map((_,i)=>a.id+'_'+i));
  const c=node(`<div class="card"><div class="row"><h2>${oblig?'Requisitos obligatorios':'Madurez de gestión'}</h2>${oblig?'<span class="tag t-law">Obligación legal</span>':'<span class="tag t-prop">Propuesta de FARMIX</span>'}<span class="spacer"></span><span class="muted small" id="pg"></span></div>
    <div class="progress"><div id="pgb"></div></div>
    <p class="desc">${oblig?'Exigencias de la norma. Un "No cumple" se muestra como pendiente y no se compensa con los demás.':'Buenas prácticas propuestas por FARMIX (no son exigencias legales). Cada área recibe un puntaje de 1 a 5.'}</p></div>`);
  const opts=id=>`<div class="opts" data-id="${id}">${[['si','Cumple'],['no','No cumple'],['na','No aplica']].map(([k,l])=>`<button class="opt ${resp[id]===k?k:''}" data-v="${k}">${l}</button>`).join('')}</div>`;
  if(oblig) OBLIGATORIOS.forEach(o=>c.appendChild(node(`<div class="q"><div class="qt">${esc(o.t)}</div><div class="qf">${esc(o.f)}</div>${opts(o.id)}</div>`)));
  else MADUREZ.forEach(a=>{ c.appendChild(node(`<div class="area-head" style="margin-top:14px"><b>${esc(a.n)}</b><span class="score" id="sc_${a.id}"></span></div>`));
    a.items.forEach((t,i)=>c.appendChild(node(`<div class="q"><div class="qt">${esc(t)}</div>${opts(a.id+'_'+i)}</div>`))); });
  c.appendChild(node(`<div class="note">${AVISO_LEGAL}</div>`));
  v.appendChild(c);
  function upd(){ const n=ids.filter(id=>resp[id]).length; document.getElementById('pg').textContent=`${n} de ${ids.length} respondidas`;
    document.getElementById('pgb').style.width=(n/ids.length*100)+'%';
    if(!oblig){ const e=evaluarDiag(resp); MADUREZ.forEach(a=>document.getElementById('sc_'+a.id).textContent=e.mad[a.id]!=null? e.mad[a.id]+' / 5':'—'); } }
  c.querySelectorAll('.opts').forEach(o=>o.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const id=o.dataset.id, k=b.dataset.v; resp[id]= resp[id]===k? undefined : k;
    o.querySelectorAll('.opt').forEach(x=>x.className='opt'); if(resp[id]) b.classList.add(k); save(); upd(); }));
  upd();
  const sv=node(`<div class="sticky-save"></div>`);

    const e=evaluarDiag(resp);
    if(e.ob.sin>0 && !confirm(`Faltan ${e.ob.sin} requisito(s) obligatorio(s) por responder. ¿Guardar de todas formas?`)) return;
    data.diagnosticos.push({fecha:hoyISO(),resp:JSON.parse(JSON.stringify(resp)),eval:e}); save(); diagSeg='resultados'; render(); toast('Diagnóstico guardado'); celebrar(); }));

    v.appendChild(node(`<div class="card"><h2>Antes y después</h2><p class="desc">Línea base del ${fechaCorta(b.fecha)} comparada con el diagnóstico del ${fechaCorta(u.fecha)}.</p>

      <tr><td>Pendientes por resolver</td><td>${b.eval.ob.no.length}</td><td>${u.eval.ob.no.length}</td>${dif(b.eval.ob.no.length,u.eval.ob.no.length,true)}</tr>
      ${MADUREZ.map(a=>`<tr><td>${esc(a.n)}</td><td>${f(b.eval.mad[a.id])}</td><td>${f(u.eval.mad[a.id])}</td>${dif(b.eval.mad[a.id],u.eval.mad[a.id])}</tr>`).join('')}

  }

/* ================= Importar archivo ================= */
function normalizeDate(v){ if(!v) return ''; v=String(v).trim(); if(/^\d{4}-\d{1,2}-\d{1,2}/.test(v)) return v.slice(0,10);
  const m=v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/); if(m){ let[,d,mo,y]=m; if(y.length===2) y='20'+y; return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`; } return v; }
function parseCSV(t){ const L=t.split(/\r?\n/).filter(l=>l.trim()); if(!L.length) return []; const dl=L[0].split(';').length>L[0].split(',').length?';':','; return L.map(l=>l.split(dl).map(c=>c.trim().replace(/^"|"$/g,''))); }
const num=s=>+String(s||'').replace(/[$\s]/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.')||0;
function importar(tipo){
  const campos= tipo==='vencimientos'? [['producto','Producto'],['lote','Lote'],['fecha','Fecha de vencimiento'],['cantidad','Cantidad'],['costo','Costo unitario']]
    : [['fecha','Fecha'],['tipo','Tipo de residuo'],['clasificacion','Clasificación'],['cantidad','Cantidad'],['unidad','Unidad']];
  const w=node(`<div><p class="muted small" style="margin-top:0">Sube un archivo CSV o Excel exportado de tu sistema (por ejemplo, el de punto de venta). Luego indica qué columna corresponde a cada dato. No importes datos de clientes.</p>
    <input type="file" accept=".csv,.xlsx,.xls" id="imp_f" class="btn btn-soft" style="width:100%"><div id="imp_m"></div></div>`);
  let filas=null;
  const foot=[mkBtn('Importar','btn-primary',()=>{
    if(!filas){ toast('Primero elige un archivo'); return; }
    const map={}; w.querySelectorAll('[data-k]').forEach(s=>{ if(s.value!=='') map[s.dataset.k]=+s.value; });
    let n=0; filas.slice(1).forEach(r=>{ if(!r.some(x=>String(x).trim())) return; const g=k=>map[k]!=null? String(r[map[k]]??'').trim() : '';
      if(tipo==='vencimientos'){ if(!g('producto')&&!g('lote')) return; data.vencimientos.push({producto:g('producto'),lote:g('lote'),fecha:normalizeDate(g('fecha')),cantidad:num(g('cantidad')),costo:num(g('costo')),destino:'Pendiente de gestión',soporte:''}); }
      else { const cl=CLASES.find(c=>c.toLowerCase()===g('clasificacion').toLowerCase())||({'peligroso':'Peligroso','no peligroso':'No peligroso'})[g('clasificacion').toLowerCase().trim()]; data.residuos.push({fecha:normalizeDate(g('fecha')),tipo:g('tipo'),clasificacion:cl||'',cantidad:num(g('cantidad')),unidad:(g('unidad')||'kg').toLowerCase()}); migrarClase(data.residuos[data.residuos.length-1]); }
      n++; });
    save(); closeSheet(); render(); toast(`${n} registro(s) importado(s)`); })];
  openSheet({title:'Importar archivo', body:w, foot});
  w.querySelector('#imp_f').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const xl=/\.xlsx?$/i.test(f.name), rd=new FileReader();
    rd.onload=ev=>{ try{ filas= xl&&window.XLSX? XLSX.utils.sheet_to_json(XLSX.read(ev.target.result,{type:'array'}).Sheets[XLSX.read(ev.target.result,{type:'array'}).SheetNames[0]],{header:1,raw:false}) : parseCSV(ev.target.result);
      filas=(filas||[]).filter(r=>r&&r.some(x=>String(x).trim())); }catch(err){ filas=null; }
      const m=w.querySelector('#imp_m');
      if(!filas||filas.length<2){ m.innerHTML='<p class="muted small">No se encontraron filas para importar. Revisa el formato.</p>'; filas=null; return; }
      const hd=filas[0];
      m.innerHTML=`<p class="small"><b>${filas.length-1}</b> fila(s) encontradas. Asigna las columnas:</p><div class="form">${campos.map(([k,l])=>{
        const guess=hd.findIndex(h=>String(h).toLowerCase().includes(l.toLowerCase().split(' ')[0].slice(0,5)));
        return `<div class="field"><label>${l}</label><select data-k="${k}"><option value="">No importar</option>${hd.map((h,i)=>`<option value="${i}" ${i===guess?'selected':''}>${esc(h)}</option>`).join('')}</select></div>`; }).join('')}</div>`; };
    xl? rd.readAsArrayBuffer(f) : rd.readAsText(f); };
}

function docReporte(){

/* Pagina los bloques en hojas A4: un bloque que no cabe pasa a la hoja siguiente con su título; una tabla se divide por filas y repite su encabezado. */
function paginarDoc(cont,doc){
  cont.innerHTML=''; const pie=()=>`<footer class="fx-foot"><span>FARMIX · ${esc(doc.meta.codigo)} · Generado el ${fechaCorta(doc.meta.fecha)}</span><span class="fx-num"></span></footer>`;
  const portada=node(`<section class="fx-page fx-cover">${doc.portada}${pie()}</section>`); cont.appendChild(portada);
  const nueva=()=>{ const s=node(`<section class="fx-page"><header class="fx-head">${FX_LOGO(fxId())}<div><b>FARMIX</b><span>${esc(doc.meta.titulo)} · ${esc(doc.meta.nombre)}</span></div></header><div class="fx-body"></div>${pie()}</section>`); cont.appendChild(s); return s.querySelector('.fx-body'); };
  const lleno=c=>c.scrollHeight>c.clientHeight+1;
  let body=nueva(); const cola=doc.bloques.map(h=>node(h));
  while(cola.length){
    const b=cola.shift(); body.appendChild(b); if(!lleno(body)) continue;
    const tb=b.querySelector('tbody');
    if(tb&&tb.children.length>1){
      const resto=b.cloneNode(true); resto.classList.add('fx-cont'); const rtb=resto.querySelector('tbody'); rtb.innerHTML='';
      while(lleno(body)&&tb.children.length>1) rtb.prepend(tb.lastElementChild);
      if(!lleno(body)&&rtb.children.length){ cola.unshift(resto); body=nueva(); continue; }
      [...rtb.children].forEach(r=>tb.appendChild(r));   // ni con una fila cabe aquí: la tabla entera pasa a la hoja siguiente
    }
    if(body.children.length===1) continue;   // el bloque ya está solo en su hoja: se deja (no se puede hacer más)
    body.removeChild(b); const mover=[b]; const prev=body.lastElementChild;
    if(prev&&prev.dataset.keep==='next'&&body.children.length>1){ body.removeChild(prev); mover.unshift(prev); }
    body=nueva(); mover.slice(0,-1).forEach(x=>body.appendChild(x)); cola.unshift(mover[mover.length-1]);
  }
  if(!body.children.length) body.parentElement.remove();
  const hojas=[...cont.querySelectorAll('.fx-page')]; hojas.forEach((h,i)=>h.querySelector('.fx-num').textContent=`Página ${i+1} de ${hojas.length}`);
  return hojas.length;
}
const fxSlug=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60)||'Drogueria';

function fxCargar(src,glob){ const ya=()=>glob.split('.').reduce((o,k)=>o&&o[k],window); if(ya()) return Promise.resolve(ya());
  return new Promise((ok,ko)=>{ const s=document.createElement('script'); s.src=src; s.onload=()=>ya()?ok(ya()):ko(new Error('la librería no quedó disponible')); s.onerror=()=>ko(new Error('no se pudo cargar la librería de PDF')); document.head.appendChild(s); }); }
async function fxGuardarPDF(btn,cont,doc){
  if(btn.disabled) return; const html=btn.innerHTML; btn.disabled=true; btn.setAttribute('aria-busy','true'); btn.innerHTML=icon('down')+'Generando PDF…';
  try{
    await fxCargar('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js','html2canvas');
    await fxCargar('https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js','jspdf.jsPDF');
    const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',compress:true}), hojas=[...cont.querySelectorAll('.fx-page')];
    if(!hojas.length) throw new Error('el documento no tiene páginas');
    for(let i=0;i<hojas.length;i++){ const c=await html2canvas(hojas[i],{scale:2,backgroundColor:'#ffffff',logging:false}); if(i) pdf.addPage(); pdf.addImage(c.toDataURL('image/jpeg',.92),'JPEG',0,0,210,297,undefined,'FAST'); }
    pdf.setProperties({title:`${doc.meta.titulo} · ${doc.meta.nombre}`,subject:'Reporte generado con FARMIX (MVP)',creator:'FARMIX'});
    const blob=pdf.output('blob'); if(!blob||!blob.size) throw new Error('el PDF quedó vacío');
    const nombre=fxNombreArchivo(doc), url=URL.createObjectURL(blob), a=document.createElement('a'); a.href=url; a.download=nombre; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),5000);
    toast(`PDF generado (${hojas.length} páginas): ${nombre}. Si no aparece, revisa las descargas del navegador.`);
  }catch(err){ toast('No se pudo generar el PDF: '+(err.message||err)); }
  finally{ btn.disabled=false; btn.removeAttribute('aria-busy'); btn.innerHTML=html; }
}
function fxImprimir(cont){
  const copia=document.createElement('div'); copia.id='fxPrint'; copia.innerHTML=cont.innerHTML.replace(/fxg(\d+)/g,'fxp$1'); /* ids propios: si no, el degradado del logotipo apunta al original oculto */ document.body.appendChild(copia); document.body.classList.add('fx-print-mode');

}

// Los soportes (certificados, listas de asistencia) se guardan en IndexedDB del navegador; si no está disponible, en memoria temporal.
const Soportes={ db:null, mem:new Map(),
  open(){ if(this.p) return this.p; this.p=new Promise(res=>{ try{ const r=indexedDB.open('farmix_soportes',1); r.onupgradeneeded=()=>r.result.createObjectStore('files'); r.onsuccess=()=>{ this.db=r.result; res(true); }; r.onerror=()=>res(false); }catch(e){ res(false); } }); return this.p; },
  async put(id,file){ await this.open(); if(!this.db){ this.mem.set(id,file); return; } await new Promise((res,rej)=>{ const t=this.db.transaction('files','readwrite'); t.objectStore('files').put(file,id); t.oncomplete=res; t.onerror=()=>{ this.mem.set(id,file); res(); }; }); },
  async get(id){ await this.open(); if(this.mem.has(id)) return this.mem.get(id); if(!this.db) return null; return new Promise(res=>{ const q=this.db.transaction('files').objectStore('files').get(id); q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null); }); },
  async del(id){ this.mem.delete(id); await this.open(); if(!this.db) return; try{ this.db.transaction('files','readwrite').objectStore('files').delete(id); }catch(_){} } };
