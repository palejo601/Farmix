<!doctype html>
<html><head><meta charset="utf-8"><title>Fibonacci Mega Ruleta</title>
<style>html,body{margin:0;background:#000}canvas{display:block;max-height:100vh;margin:auto}</style></head>
<body><canvas id="cv" width="1080" height="1920"></canvas>
<script src="voz.js"></script>
<script>
// Motion graphics v2: Estrategia Fibonacci en Mega Ruleta, narrado. Render determinista: renderFrame(t)
const cv=document.getElementById('cv'),X=cv.getContext('2d');
const W=1080,H=1920,PI=Math.PI,TAU=PI*2;
const C={bg:'#0b1240',bg2:'#121c5c',pan:'#18236e',ln:'#34449e',g:'#00e701',gd:'#05080a',m:'#aab4e8',r:'#d0213d',blk:'#111843',gold:'#ffd34d',lose:'#ff4d6d',blue:'#1475e1'};
const F='Inter, "Noto Color Emoji", sans-serif';
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lerp=(a,b,p)=>a+(b-a)*p,seg=(t,a,d)=>cl((t-a)/d);
const eo=p=>1-Math.pow(1-p,3),eio=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const back=p=>{const c=1.9;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)};
const elastic=p=>p<=0?0:p>=1?1:Math.pow(2,-10*p)*Math.sin((p*10-.75)*TAU/3)+1;
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const fmt=v=>String(Math.round(Math.abs(v))).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const EV=[],SH=[],FL=[],CF=[];
const ev=(t,type,o={})=>EV.push({t:+t.toFixed(3),type,...o});
const shk=(t,a)=>SH.push({t,a}),fl=(t,col,d=.5,a=.5)=>FL.push({t,col,d,a});

// ---------- dibujo base ----------
function txt(s,x,y,size,col,o={}){
  X.font=`${o.w||900} ${size}px ${F}`;X.textAlign=o.al||'center';X.textBaseline=o.bl||'middle';X.letterSpacing=(o.ls||0)+'px';
  if(o.stroke){X.lineWidth=o.stroke;X.strokeStyle=o.sc||'#000';X.lineJoin='round';X.strokeText(s,x,y)}
  if(o.glow){X.shadowColor=o.gc||col;X.shadowBlur=o.glow}
  X.fillStyle=col;X.fillText(s,x,y);X.shadowBlur=0;X.letterSpacing='0px';
}
function goldGrad(y,h){const g=X.createLinearGradient(0,y-h/2,0,y+h/2);g.addColorStop(0,'#fff6c2');g.addColorStop(.45,'#ffd34d');g.addColorStop(1,'#e07b00');return g}
function rr(x,y,w,h,r,fill,stroke,lw=2){X.beginPath();X.roundRect(x,y,w,h,r);if(fill){X.fillStyle=fill;X.fill()}if(stroke){X.lineWidth=lw;X.strokeStyle=stroke;X.stroke()}}
function tr(x,y,s,fn,a=1,rot=0){if(a<=0||s<=0)return;X.save();X.globalAlpha*=cl(a);X.translate(x,y);if(rot)X.rotate(rot);X.scale(s,s);fn();X.restore()}
function slam(t,t0,x,y,fn,d=.35){if(t<t0)return;const p=seg(t,t0,d);tr(x,y,lerp(2.6,1,eo(p)),fn,p*1.6)}
function popIn(t,t0,x,y,fn,d=.4){if(t<t0)return;tr(x,y,back(seg(t,t0,d)),fn,seg(t,t0,d*.6))}
function bolt(x0,y0,x1,y1,seed,a){
  if(a<=0)return;const n=12,pts=[];for(let i=0;i<=n;i++){const p=i/n,j=(i==0||i==n)?0:(rnd(seed+i*7.3)-.5)*90;pts.push([lerp(x0,x1,p)+j,lerp(y0,y1,p)+j*.3])}
  X.save();X.globalAlpha=cl(a);X.lineJoin='round';X.shadowColor='#ffe27a';X.shadowBlur=30;
  [[14,'rgba(255,200,61,.55)'],[5,'#fffbe6']].forEach(([w,c])=>{X.lineWidth=w;X.strokeStyle=c;X.beginPath();pts.forEach((p,i)=>i?X.lineTo(...p):X.moveTo(...p));X.stroke()});
  X.restore();
}
function hexPill(x,y,w,h,fill,stroke){const k=Math.min(18,h/4);X.beginPath();X.moveTo(x+w/2,y);X.lineTo(x+w,y+k);X.lineTo(x+w,y+h-k);X.lineTo(x+w/2,y+h);X.lineTo(x,y+h-k);X.lineTo(x,y+k);X.closePath();
  if(fill){X.fillStyle=fill;X.fill()}if(stroke){X.lineWidth=2;X.strokeStyle=stroke;X.stroke()}}

// ---------- ruleta europea ----------
const ORDER=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
const REDS=new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
const colOf=n=>n===0?'#139a43':REDS.has(n)?C.r:'#151b3f';
const txtCol=n=>n===0?'#22c55e':REDS.has(n)?'#ff3b55':'#fff';
const SL=TAU/37;
function mkWheel(R,big){
  const k=R/375,S=Math.ceil(R*2+160),c=S/2,mk=()=>{const q=document.createElement('canvas');q.width=q.height=S;return [q,q.getContext('2d')]};
  const [bowl,b]=mk();b.shadowColor=big?'rgba(255,165,40,.8)':'rgba(255,200,61,.55)';b.shadowBlur=big?90:50;
  let g=b.createLinearGradient(0,0,S,S);
  (big?[[0,'#4a4a56'],[.35,'#121216'],[.65,'#2a2a33'],[1,'#08080a']]:[[0,'#fff3b8'],[.3,'#e0a92a'],[.55,'#7a4d06'],[.8,'#f5d06b'],[1,'#9b6a12']]).forEach(s=>g.addColorStop(...s));
  b.fillStyle=g;b.beginPath();b.arc(c,c,R,0,TAU);b.fill();b.shadowBlur=0;
  if(big){b.strokeStyle='#e4e7f0';b.lineWidth=5*k;b.beginPath();b.arc(c,c,R-3*k,0,TAU);b.stroke()}
  let tg=b.createRadialGradient(c,c,R-80*k,c,c,R-24*k);tg.addColorStop(0,big?'#030304':'#050d13');tg.addColorStop(1,big?'#22222a':'#1d3a4c');
  b.fillStyle=tg;b.beginPath();b.arc(c,c,R-24*k,0,TAU);b.fill();
  b.strokeStyle=big?'#b9bcc8':'#c99a2e';b.lineWidth=3*k;b.beginPath();b.arc(c,c,R-80*k,0,TAU);b.stroke();
  for(let i=0;i<8;i++){const a=i*PI/4+PI/8;b.save();b.translate(c+Math.cos(a)*(R-58*k),c+Math.sin(a)*(R-58*k));b.rotate(a+PI/2);b.scale(k,k);b.fillStyle=big?'#e8eaf2':'#f5d06b';b.beginPath();b.moveTo(-13,0);b.lineTo(0,-6);b.lineTo(13,0);b.lineTo(0,6);b.closePath();b.fill();b.restore()}
  const [rot,r]=mk();
  for(let i=0;i<37;i++){const n=ORDER[i],a0=i*SL-PI/2-SL/2,a1=a0+SL;
    r.fillStyle=big?(n===0?'#139a43':REDS.has(n)?'#c8102e':'#0d0d10'):colOf(n);r.beginPath();r.moveTo(c,c);r.arc(c,c,R-80*k,a0,a1);r.closePath();r.fill();
    r.fillStyle='rgba(0,0,0,.4)';r.beginPath();r.arc(c,c,R-140*k,a0,a1);r.arc(c,c,R-185*k,a1,a0,true);r.closePath();r.fill();
    const am=i*SL-PI/2;r.save();r.translate(c+Math.cos(am)*(R-110*k),c+Math.sin(am)*(R-110*k));r.rotate(am+PI/2);
    r.fillStyle='#fff';r.font=`800 ${Math.round(29*k)}px ${F}`;r.textAlign='center';r.textBaseline='middle';r.fillText(n,0,0);r.restore()}
  r.strokeStyle=big?'#c9ccd6':'#e6b847';r.lineWidth=2.5*k;
  for(let i=0;i<37;i++){const a=i*SL-PI/2-SL/2;r.beginPath();r.moveTo(c+Math.cos(a)*(R-185*k),c+Math.sin(a)*(R-185*k));r.lineTo(c+Math.cos(a)*(R-80*k),c+Math.sin(a)*(R-80*k));r.stroke()}
  [R-140*k,R-185*k].forEach(rad=>{r.lineWidth=3*k;r.beginPath();r.arc(c,c,rad,0,TAU);r.stroke()});
  let cg=r.createRadialGradient(c-50*k,c-50*k,10,c,c,R-186*k);(big?[[0,'#5a5a66'],[.6,'#1a1a20'],[1,'#060608']]:[[0,'#3d6278'],[.6,'#132838'],[1,'#08131c']]).forEach(s=>cg.addColorStop(...s));
  r.fillStyle=cg;r.beginPath();r.arc(c,c,R-186*k,0,TAU);r.fill();
  for(let i=0;i<4;i++){r.save();r.translate(c,c);r.rotate(i*PI/2);r.scale(k,k);let ag=r.createLinearGradient(0,-10,0,10);ag.addColorStop(0,big?'#ffffff':'#fff0a8');ag.addColorStop(1,big?'#7d8396':'#a8740f');
    r.fillStyle=ag;r.beginPath();r.moveTo(0,-9);r.lineTo(120,-4);r.lineTo(120,4);r.lineTo(0,9);r.fill();r.beginPath();r.arc(128,0,12,0,TAU);r.fill();r.restore()}
  let dg=r.createRadialGradient(c-12*k,c-14*k,4,c,c,46*k);(big?[[0,'#ffffff'],[.5,'#b8bdcc'],[1,'#4a4f60']]:[[0,'#fff8d0'],[.5,'#e3ad32'],[1,'#7a4d06']]).forEach(s=>dg.addColorStop(...s));
  r.fillStyle=dg;r.beginPath();r.arc(c,c,46*k,0,TAU);r.fill();
  return {bowl,rot,S,R,k};
}
const W1=mkWheel(375,false),W2=mkWheel(600,true);
const wheelAng=t=>.5*t;
function drawWheel(cx,cy,s,t,a=1){tr(cx,cy,s,()=>{X.drawImage(W1.bowl,-W1.S/2,-W1.S/2);X.rotate(wheelAng(t));X.drawImage(W1.rot,-W1.S/2,-W1.S/2)},a)}
const WX=540,WY=440,WS=.78,SQ=.62,R_TRACK=W2.R-52*W2.k,R_POCKET=W2.R-162*W2.k,R_NUM=W2.R-110*W2.k;
const proj=(a,r)=>[WX+Math.cos(a)*r*WS,WY+Math.sin(a)*r*SQ*WS];
function ball(x,y,s=1){
  X.save();X.fillStyle='rgba(0,0,0,.45)';X.beginPath();X.ellipse(x+4*s,y+6*s,14*s,11*s,0,0,TAU);X.fill();
  const g=X.createRadialGradient(x-5*s,y-6*s,2,x,y,15*s);g.addColorStop(0,'#fff');g.addColorStop(.6,'#e6edf3');g.addColorStop(1,'#8b98a5');
  X.fillStyle=g;X.beginPath();X.arc(x,y,14*s,0,TAU);X.fill();X.restore();
}

// ---------- narración ----------
const V={};(window.VOZ||[]).forEach(s=>{const w=s.words;s.end=w.length?w[w.length-1].t+w[w.length-1].d:s.dur-.9;V[s.id]=s});
const LN={};
function say(id,t){if(!V[id])return t;LN[id]=t;ev(t,'voice',{id});return t+V[id].end}
function fw(id,list){const ws=V[id]?V[id].words:[],out=[];let j=0;
  list.forEach(w=>{while(j<ws.length&&ws[j].w.toLowerCase().replace(/[^a-záéíóúñü]/g,'')!==w)j++;out.push(j<ws.length?LN[id]+ws[j].t:null);j++});
  const t0=LN[id]||0,t1=t0+(V[id]?V[id].end:3);return out.map((v,i)=>v==null?lerp(t0,t1,i/Math.max(1,list.length)):v)}
const SUBS=[];
function buildSubs(){Object.keys(LN).forEach(id=>{const s=V[id],t0=LN[id];let ch=null;
  s.words.forEach((w,i)=>{const prev=s.words[i-1],gap=prev?w.t-(prev.t+prev.d):0,len=ch?ch.words.reduce((a,q)=>a+q.w.length+1,0):0;
    if(!ch||ch.words.length>=4||gap>.22||len+w.w.length>22){ch={t0:t0+w.t,words:[]};SUBS.push(ch)}ch.words.push({w:w.w,t:t0+w.t})});});
  SUBS.sort((a,b)=>a.t0-b.t0);SUBS.forEach((c,i)=>{const lineEnd=c.words[c.words.length-1].t+.6;c.t1=Math.min(SUBS[i+1]?SUBS[i+1].t0:1e9,lineEnd)})}
function subs(t,y){const c=SUBS.find(c=>t>=c.t0&&t<c.t1);if(!c)return;
  let fs=62;X.font=`900 ${fs}px ${F}`;const sp=X.measureText(' ').width+14,ws=c.words.map(w=>X.measureText(w.w).width);let tot=ws.reduce((a,b)=>a+b,0)+sp*(ws.length-1);
  const sc=Math.min(1,980/tot);tr(540,y,sc*lerp(.85,1,back(seg(t,c.t0,.18))),()=>{let x=-tot/2;let cur=-1;c.words.forEach((w,i)=>{if(t>=w.t)cur=i});
    c.words.forEach((w,i)=>{const on=i===cur;tr(x+ws[i]/2,0,on?1.08:1,()=>txt(w.w,0,0,fs,on?C.gold:'#fff',{stroke:12,sc:'#000'}));x+=ws[i]+sp})})}

// ---------- datos de las simulaciones ----------
const FIB=[1,1,2,3,5,8,13,21],PLN=[7,17,26,32];
const KN=[.78,.85,.905,.945,.972,.99,1],KH=[30,16,8,4,1.5,0].map(v=>v*W2.k);
const HIST0=[{n:14},{n:32},{n:1,m:100},{n:30},{n:31},{n:16},{n:22},{n:5},{n:15}];
const mkD=(a,p)=>a.map((d,i)=>({...d,a:`${p}${i+1}a`,b:`${p}${i+1}b`}));
const CFG={
  sim:{mode:'red',bal0:100000,pre:['sim0'],post:['simEnd'],defs:mkD([{n:26,m:[[7,50],[22,100]]},{n:15,m:[[33,150],[4,50],[11,300]]},{n:0,m:[[17,500]]},{n:8,m:[[2,100],[29,50]]},{n:32,m:[[14,250],[35,50]]},{n:19,m:[[19,200],[6,50]]},{n:3,m:[[24,100],[9,50]]}],'s')},
  doc:{mode:'doz',bal0:100000,pre:['doc1','doc2','doc3'],post:['docEnd'],defs:mkD([{n:5,m:[[12,100]]},{n:31,m:[[30,50],[3,150]]},{n:9,m:[[27,200]]},{n:21,m:[[1,50],[36,100]]},{n:16,m:[[11,300]]}],'d')},
  pl:{mode:'pleno',bal0:104000,pre:['pl1','pl2'],post:['pl3','pl4'],defs:mkD([{n:21,m:[[17,100],[2,50]],c:500},{n:26,m:[[33,200],[8,50]],c:250}],'p')},
};
const SC={},TT={},SPINS=[],SESS={};let DUR=60,prevRel=null;
function ballState(t){
  let st=null;for(const s of SPINS){if(t>=s.roll)st=s}
  if(!st)return null;
  if(t>=st.land)return {rel:st.rel,r:R_POCKET,a:1};
  const p=(t-st.roll)/st.D,rel=st.rel+Math.pow(1-p,2.2)*st.delta;let r;
  if(p<.06)r=st===SPINS[0]?R_TRACK:lerp(R_POCKET,R_TRACK,eo(p/.06));
  else if(p<.6)r=R_TRACK;
  else if(p<KN[0])r=lerp(R_TRACK,R_POCKET+4,eio((p-.6)/(KN[0]-.6)))+Math.sin(p*90)*4;
  else{r=R_POCKET;for(let j=0;j<KH.length;j++)if(p>=KN[j]&&p<KN[j+1])r+=KH[j]*Math.sin(PI*(p-KN[j])/(KN[j+1]-KN[j]))}
  return {rel,r,a:st===SPINS[0]?seg(t,st.roll,.12):1};
}
function runSession(key,t){
  const cfg=CFG[key],S={key,mode:cfg.mode,bal0:cfg.bal0,spins:[]};SESS[key]=S;SC[key]=[t];ev(t+.3,'pop');
  let e=t+.3;cfg.pre.forEach(id=>{e=say(id,e+.5)});let tt=e+.7,idx=0;
  cfg.defs.forEach((d,i)=>{
    const mode=cfg.mode,a=say(d.a,tt+.2),land=Math.max(a+.6,tt+4.8),k=ORDER.indexOf(d.n),rel=k*SL-PI/2,bet=mode==='pleno'?d.c*PLN.length:FIB[idx]*1000;
    const s={...d,i,mode,tS:tt,D:3.2,land,roll:land-3.2,k,rel,idx,bet};
    s.win=mode==='red'?REDS.has(d.n):mode==='doz'?(d.n>=13&&d.n<=24):PLN.includes(d.n);
    s.pay=s.win?(mode==='red'?2*bet:mode==='doz'?3*bet:31*d.c):0;
    s.next=mode==='red'?(s.win?Math.max(0,idx-2):idx+1):mode==='doz'?(s.win?0:idx+1):idx;idx=s.next;
    const pr=prevRel===null?rel+2.1:prevRel;s.delta=((pr-rel)%TAU+TAU)%TAU+TAU*4;prevRel=rel;
    s.end=say(d.b,land+.55)+.8;tt=s.end;SPINS.push(s);S.spins.push(s);
    s.m.forEach((_,j)=>{ev(s.tS+.1+j*.25,'zap',{v:.55});fl(s.tS+.1+j*.25,'#fff3b0',.2,.15)});ev(s.tS+.35,'chip');
    ev(s.roll,'roll',{d:s.D});ev(s.roll+s.D*.66,'clack',{v:.6});for(let j=0;j<5;j++)ev(s.roll+s.D*KN[j],'clack',{v:1-j*.18});
    shk(s.land,7);
    if(s.win){ev(s.land+.25,'win');ev(s.land+.4,'coin');fl(s.land,C.g,.7,.3);CF.push({t:s.land+.25,x:540,y:560,n:46,seed:SPINS.length*31})}
    else{ev(s.land+.1,'lose');fl(s.land,C.r,.7,.35)}
    if(s.m.some(([n])=>n===s.n)){ev(s.land,'boom');ev(s.land+.05,'zap');shk(s.land,20);fl(s.land,'#ffc83d',.9,.5);CF.push({t:s.land+.1,x:540,y:560,n:70,seed:99,gold:1})}
    ev(s.land+1.0,'pop');for(let j=0;j<3;j++)ev(s.land+.65+j*.14,'tick');
  });
  e=tt;cfg.post.forEach((id,i)=>{e=say(id,i?e+.5:tt+.3);ev(LN[id],'whoosh',{v:.5})});
  S.post=cfg.post.map(id=>LN[id]);t=e+1.4;SC[key][1]=t;return t;
}

// ---------- línea de tiempo (guiada por la voz) ----------
(function build(){
  let e,t;
  ev(.25,'boom');shk(.33,16);ev(.65,'boom');shk(.73,22);ev(1.15,'pop');ev(1.55,'zap');fl(1.55,'#fff3b0',.35,.35);
  e=say('intro1',.9);e=say('intro2',e+.4);t=e+1.0;SC.intro=[0,t];
  SC.fib=[t];TT.fibHead=t+.2;ev(TT.fibHead,'boom',{v:.7});shk(TT.fibHead+.08,10);
  e=say('fib1',t+.6);e=say('fib2',e+.45);TT.cards=fw('fib2',['uno','uno','dos','tres','cinco','ocho','trece','veintiuno','treinta']);TT.cards.forEach(c=>ev(c,'pop',{v:.8}));
  e=say('fib3',e+.5);TT.fibPill=fw('fib3',['escalera'])[0];ev(TT.fibPill,'coin');t=e+1.2;SC.fib[1]=t;
  SC.rules=[t];TT.rulesHead=t+.2;ev(TT.rulesHead,'boom',{v:.7});shk(TT.rulesHead+.08,10);
  e=say('rules1',t+.6);e=say('rules2',e+.45);TT.card1=LN.rules2;
  e=say('rules3',e+.5);TT.card2=LN.rules3;TT.mv2=fw('rules3',['subes'])[0];
  e=say('rules4',e+.5);TT.card3=LN.rules4;TT.mv3=fw('rules4',['bajas'])[0];
  [TT.card1,TT.card2,TT.card3].forEach(x=>ev(x,'whoosh',{v:.5}));ev(TT.mv2,'lose',{v:.5});ev(TT.mv3,'pop');ev(TT.mv3+.3,'pop');
  e=say('rules5',e+.5);TT.r5=LN.rules5;ev(TT.r5,'pop');t=e+1.5;SC.rules[1]=t;
  SC.mega=[t];TT.megaHead=t+.2;ev(TT.megaHead,'boom',{v:.7});
  e=say('mega1',t+.7);[TT.bolts,TT.badges,TT.b500]=fw('mega1',['rayos','multiplicadores','quinientas']);
  for(let i=0;i<4;i++){ev(TT.bolts+i*.3,'zap',{v:.7});fl(TT.bolts+i*.3,'#fff3b0',.25,.25)}
  for(let i=0;i<3;i++)ev(TT.badges+i*.28,'pop');ev(TT.b500,'boom',{v:.6});ev(TT.b500,'coin');shk(TT.b500,12);
  e=say('mega2',e+.5);TT.mc1=fw('mega2',['pleno'])[0];TT.mc2=fw('mega2',['rojo'])[0];ev(TT.mc1,'pop');ev(TT.mc2,'lose',{v:.5});
  e=say('mega3',e+.45);TT.mc3=fw('mega3',['treinta'])[0];ev(TT.mc3,'pop');t=e+1.4;SC.mega[1]=t;
  t=runSession('sim',t);
  t=runSession('doc',t);TT.dz=fw('doc1',['uno','trece','veinticinco']);TT.dz.forEach(x=>ev(x,'pop',{v:.6}));
  t=runSession('pl',t);
  // RACHA
  SC.streak=[t];TT.stHead=t+.2;ev(TT.stHead,'alarm');ev(TT.stHead,'boom');shk(TT.stHead+.05,18);fl(TT.stHead,C.r,.7,.5);
  e=say('streak1',t+.7);TT.stQ=LN.streak1+.1;
  e=say('streak2',e+.45);TT.bars=fw('streak2',['mil','mil','dos','tres','cinco','ocho','trece','veintiún','treinta','cincuenta']);
